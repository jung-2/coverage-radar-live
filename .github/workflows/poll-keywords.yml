name: 커버리지 레이더 수집 - 키워드

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# 이전 실행이 안 끝났으면 기다림(같은 키워드를 두 번 조회하지 않게)
concurrency:
  group: poll-keywords
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: node scraper/poll.mjs keywords
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

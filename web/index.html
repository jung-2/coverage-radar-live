<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>커버리지 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7; --text:#1A1A18; --sub:#6B6A63; --border:#E8E8E8;
    --stat:#F5F4ED; --block:#FFFFFF; --headerbg:#FFFFFFEE; --pillbg:#F0EFE8; --hover:#F0EFE8;
    --beat:#1D9E75; --miss:#D64545; --note:#D18F2E; --info:#2F7DD1;
    --cat-packaging:#8B5CF6; --cat-hbm:#12977F; --cat-cpo:#2F7DD1; --cat-power:#D18F2E;
    --cat-ai_server:#5C6BC0; --cat-korea:#C0392B; --cat-biotech:#C2478E;
    --cat-disclosure:#8A8578; --cat-telegram:#2AA8C7; --cat-other:#9C9891;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15140F; --text:#EDEAE0; --sub:#9C9891; --border:#33322A;
      --stat:#201F19; --block:#1B1A15; --headerbg:#15140FEE; --pillbg:#221F17; --hover:#26241C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15140F; --text:#EDEAE0; --sub:#9C9891; --border:#33322A;
    --stat:#201F19; --block:#1B1A15; --headerbg:#15140FEE; --pillbg:#221F17; --hover:#26241C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.5;}
  a{color:inherit;}
  .top{position:sticky;top:0;z-index:10;background:var(--headerbg);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;}
  .brand{font-weight:700;font-size:15px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--beat);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .meta{color:var(--sub);font-size:11px;margin-left:auto;}
  .wrap{max-width:920px;margin:0 auto;padding:14px 16px 60px;}
  .sec{font-size:13px;font-weight:600;margin:0;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:flex;align-items:center;gap:5px;background:var(--pillbg);border-radius:14px;padding:4px 10px;font-size:11px;}
  .chip button{border:none;background:none;color:var(--sub);cursor:pointer;font-size:12px;padding:0;line-height:1;}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .cat-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:14px;background:var(--pillbg);font-size:11px;cursor:pointer;border:1px solid transparent;}
  .cat-pill.active{border-color:var(--info);}
  .dot{width:7px;height:7px;border-radius:50%;}
  #search-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--block);color:var(--text);font-size:12px;font-family:inherit;margin-bottom:10px;}
  .day-label{font-size:11px;color:var(--sub);font-weight:600;margin:14px 0 6px;}
  .item{background:var(--block);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
  .item-top{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
  .badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:600;}
  .badge.beat{background:var(--beat);color:#fff;}
  .badge.miss{background:var(--miss);color:#fff;}
  .badge.note{background:var(--note);color:#fff;}
  .badge.neutral{background:var(--sub);color:#fff;}
  .item-title{font-size:13px;font-weight:500;}
  .item-title a{text-decoration:none;}
  .item-title a:hover{text-decoration:underline;}
  .item-src{font-size:10px;color:var(--sub);}
  .item-sum{font-size:11.5px;color:var(--sub);margin-top:4px;}
  .empty{color:var(--sub);font-size:12px;padding:8px 0;}

  /* 브리핑 히어로 섹션 */
  .hero{background:var(--block);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .hero-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .hero-head button{font-size:12px;padding:7px 14px;border:none;border-radius:6px;background:var(--info);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;}
  .hero-head button:disabled{opacity:.5;cursor:default;}
  .brief-status{color:var(--sub);font-size:11px;min-height:14px;margin-bottom:6px;}
  .day-group{margin-top:14px;}
  .day-title{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
  .sig-row{background:var(--stat);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .sig-row:last-child{margin-bottom:0;}
  .sig-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;}
  .sig-badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;color:#fff;letter-spacing:.02em;}
  .sig-target{font-size:10px;background:var(--pillbg);border-radius:10px;padding:2px 8px;color:var(--text);}
  .sig-src{font-size:10px;color:var(--sub);margin-left:auto;white-space:nowrap;}
  .sig-title{font-size:12.5px;font-weight:500;}
  .sig-title a{text-decoration:none;}
  .sig-title a:hover{text-decoration:underline;}
  .sig-why{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.65;}
  .sig-row-compact .sig-title{font-size:11.5px;font-weight:400;}
  .sig-low-group{background:var(--block);border:1px solid var(--border);border-radius:8px;margin-top:2px;}
  .sig-low-group summary{padding:8px 12px;font-size:11px;color:var(--info);cursor:pointer;list-style:none;}
  .sig-low-group summary::-webkit-details-marker{display:none;}
  .sig-low-group summary::before{content:"▸ ";}
  .sig-low-group[open] summary::before{content:"▾ ";}
  .sig-low-list{padding:0 12px 8px;}
  .sig-low-list .sig-row{background:transparent;border-bottom:1px solid var(--border);border-radius:0;padding:7px 0;margin-bottom:0;}
  .sig-low-list .sig-row:last-child{border-bottom:none;}
  .sig-timeline{margin-top:6px;}
  .sig-timeline summary{font-size:10.5px;color:var(--info);cursor:pointer;list-style:none;}
  .sig-timeline summary::-webkit-details-marker{display:none;}
  .sig-timeline summary::before{content:"▸ ";}
  .sig-timeline[open] summary::before{content:"▾ ";}
  .sig-timeline-list{margin-top:5px;display:flex;flex-direction:column;gap:5px;}
  .sig-timeline-item{font-size:11px;color:var(--sub);line-height:1.5;}
  .sig-timeline-time{font-weight:700;color:var(--text);margin-right:4px;}
  .sig-sources{margin-top:6px;}
  .sig-sources summary{font-size:10.5px;color:var(--info);cursor:pointer;list-style:none;}
  .sig-sources summary::-webkit-details-marker{display:none;}
  .sig-sources summary::before{content:"▸ ";}
  .sig-sources[open] summary::before{content:"▾ ";}
  .sig-source-list{margin-top:5px;display:flex;flex-direction:column;gap:6px;}
  .sig-source-item{font-size:11px;}
  .sig-source-item a{text-decoration:none;}
  .sig-source-item a:hover{text-decoration:underline;}
  .sig-source-meta{color:var(--sub);font-size:10px;}
  /* 회사/섹터 기준 그룹 카드 (2026-09-22 추가): targets[0](대표 회사/섹터명) 기준으로 묶어서
     상위 카드 하나 + 그 아래 사건별 서브 항목으로 보여줌 */
  .sig-group{background:var(--stat);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .sig-group:last-child{margin-bottom:0;}
  .sig-group-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;}
  .sig-group-title{font-size:13px;font-weight:700;}
  .sig-group-count{font-size:10px;color:var(--sub);background:var(--pillbg);border-radius:10px;padding:1px 7px;}
  .sig-group-items{display:flex;flex-direction:column;gap:6px;}
  .sig-subitem{background:var(--block);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
  .sig-subitem-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;}
  .sig-badge-sm{font-size:8px;padding:1px 5px;}
  .sig-subitem-title{font-size:12px;font-weight:500;}
  .sig-verdict{font-size:11px;font-weight:800;letter-spacing:.02em;}

  /* 접이식 보조 섹션 */
  .collapse-box{background:var(--block);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;}
  .collapse-box>summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .collapse-box>summary::-webkit-details-marker{display:none;}
  .collapse-box>summary::before{content:"▸";color:var(--sub);}
  .collapse-box[open]>summary::before{content:"▾";}
  .collapse-box[open]>summary{border-bottom:1px solid var(--border);}
  .collapse-body{padding:12px;}
  .kw-row{display:flex;gap:6px;margin-bottom:8px;}
  .kw-row input{flex:1;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;}
  .kw-row button{font-size:12px;padding:6px 12px;border:none;border-radius:6px;background:var(--info);color:#fff;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
  <div class="top">
    <span class="live-dot" id="live-dot"></span>
    <span class="brand">커버리지 레이더</span>
    <span class="meta" id="last-updated">연결 중…</span>
  </div>

  <div class="wrap">
    <div class="hero">
      <div class="hero-head">
        <div class="sec">브리핑</div>
        <button id="brief-btn">브리핑 생성</button>
      </div>
      <div class="brief-status" id="brief-status"></div>

      <div class="day-group">
        <div class="day-title">오늘</div>
        <div id="brief-today"><div class="empty">아직 생성된 브리핑 없음 — "브리핑 생성" 눌러서 만들어봐</div></div>
      </div>
      <div class="day-group">
        <div class="day-title">어제</div>
        <div id="brief-yesterday"><div class="empty">기록 없음</div></div>
      </div>
    </div>

    <details class="collapse-box">
      <summary>추적 키워드 관리</summary>
      <div class="collapse-body">
        <div class="kw-row">
          <input id="kw-input" placeholder="종목명·회사명·테마 추가 (예: SK하이닉스)" />
          <button id="kw-add-btn">추가</button>
        </div>
        <div class="chips" id="kw-list"></div>
      </div>
    </details>

    <details class="collapse-box">
      <summary>텔레그램 채널 관리</summary>
      <div class="collapse-body">
        <div class="kw-row">
          <input id="tg-input" placeholder="공개채널 링크 또는 @handle (예: https://t.me/handle)" />
          <button id="tg-add-btn">추가</button>
        </div>
        <div class="chips" id="tg-list"></div>
      </div>
    </details>

    <details class="collapse-box">
      <summary>전체 피드</summary>
      <div class="collapse-body">
        <input id="search-input" placeholder="제목·요약 검색…" />
        <div class="cats" id="cat-pills"></div>
        <div id="feed"><div class="empty">데이터 로딩 중…</div></div>
      </div>
    </details>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── 여기 두 값을 Supabase 프로젝트 정보로 채우세요 (Settings > API) ──
const SUPABASE_URL = "https://jbagbwhdiswsubidzagb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpiYWdid2hkaXN3c3ViaWR6YWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjQyNzMsImV4cCI6MjEwNTUwMDI3M30.7OCA42m6KvBSVvAWKzXAtJWf6kNgoxn1QjQvXIiuw5U";
// ─────────────────────────────────────────────────────────────

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATS = [
  ["all","전체","--sub"],
  ["packaging","패키징","--cat-packaging"],
  ["hbm","HBM","--cat-hbm"],
  ["cpo","CPO/광","--cat-cpo"],
  ["power","전력반도체","--cat-power"],
  ["ai_server","AI서버","--cat-ai_server"],
  ["korea","한국주식","--cat-korea"],
  ["biotech","바이오","--cat-biotech"],
  ["disclosure","공시","--cat-disclosure"],
  ["telegram","텔레그램","--cat-telegram"],
  ["other","기타","--cat-other"],
];

let allItems = [];
let activeCat = "all";
let searchTerm = "";

function extractHandle(v){
  v = v.trim().replace(/^https?:\/\/t\.me\//i,"").replace(/^@/,"").replace(/^s\//,"");
  return v.split(/[/?]/)[0];
}

function timeAgo(iso){
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  if (diff < 60) return "방금 전";
  if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
  return `${Math.floor(diff/86400)}일 전`;
}

// KST(UTC+9) 기준 날짜/시간 — 접속 브라우저 시간대와 무관하게 항상 한국시간 기준으로 계산
function toKST(iso){
  return new Date(new Date(iso).getTime() + 9*3600*1000); // UTC로 저장된 값을 KST wall-clock으로 이동
}
function kstDateKey(iso){
  const k = toKST(iso);
  return `${k.getUTCFullYear()}-${k.getUTCMonth()}-${k.getUTCDate()}`;
}
function kstTimeLabel(iso){
  const k = toKST(iso);
  return `${String(k.getUTCHours()).padStart(2,"0")}:${String(k.getUTCMinutes()).padStart(2,"0")}`;
}
function kstFullLabel(iso){
  const k = toKST(iso);
  return `${k.getUTCMonth()+1}월 ${k.getUTCDate()}일 ${String(k.getUTCHours()).padStart(2,"0")}:${String(k.getUTCMinutes()).padStart(2,"0")} KST`;
}
// 클러스터의 day_key('YYYY-MM-DD', KST 기준)와 맞춰 비교하기 위한 자리수 고정 버전
function kstDayKeyPadded(iso){
  const k = toKST(iso);
  const y = k.getUTCFullYear();
  const m = String(k.getUTCMonth()+1).padStart(2,"0");
  const d = String(k.getUTCDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function dayLabel(iso){
  const d = new Date(iso), now = new Date();
  const sameDay = (a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if (sameDay(d, now)) return "오늘";
  if (sameDay(d, yest)) return "어제";
  return d.toLocaleDateString("ko-KR",{month:"long",day:"numeric"});
}

async function loadKeywords(){
  const {data} = await sb.from("keywords").select("term").order("term");
  renderChips("kw-list", (data||[]).map(r=>r.term), removeKeyword);
}
async function loadChannels(){
  const {data} = await sb.from("telegram_channels").select("handle").order("handle");
  renderChips("tg-list", (data||[]).map(r=>r.handle), removeChannel);
}
function renderChips(elId, list, onRemove){
  const el = document.getElementById(elId);
  el.innerHTML = list.length ? "" : `<span class="empty" style="padding:0;">아직 없음</span>`;
  list.forEach(v=>{
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span>${v}</span>`;
    const btn = document.createElement("button");
    btn.textContent = "✕";
    btn.onclick = ()=>onRemove(v);
    chip.appendChild(btn);
    el.appendChild(chip);
  });
}
async function addKeyword(){
  const input = document.getElementById("kw-input");
  const v = input.value.trim();
  if (!v) return;
  await sb.from("keywords").insert({term:v});
  input.value = "";
  loadKeywords();
}
async function removeKeyword(term){
  await sb.from("keywords").delete().eq("term", term);
  loadKeywords();
}
async function addChannel(){
  const input = document.getElementById("tg-input");
  const v = extractHandle(input.value);
  if (!v) return;
  await sb.from("telegram_channels").insert({handle:v});
  input.value = "";
  loadChannels();
}
async function removeChannel(handle){
  await sb.from("telegram_channels").delete().eq("handle", handle);
  loadChannels();
}

// ── 브리핑(클러스터) ──────────────────────────────────────
// "브리핑 생성"을 여러 번 눌러도 같은 주제는 새 카드로 또 쌓이지 않고, 기존 카드가
// 갱신되면서 그 안에 시간별 업데이트 이력이 쌓이는 구조. 카드 하나 = 클러스터 하나.
const IMPACT_LABEL = {high:"높음", medium:"중간", low:"낮음"};
const IMPACT_VAR = {high:"--miss", medium:"--note", low:"--sub"};

// note/why 텍스트 맨 앞의 "[BEAT]"/"[MISS]"/"[혼조]"/"[IN-LINE]" 마커를 색깔 뱃지로 바꾸고,
// 줄바꿈(\n)을 <br>로 바꿔줌 — 리포트 요약(2026-09-22 추가)이 여러 줄로 오는 걸 그대로 보여주기 위함
const VERDICT_LABEL = {BEAT:"BEAT", MISS:"MISS", "혼조":"혼조", "IN-LINE":"IN-LINE"};
const VERDICT_VAR = {BEAT:"--beat", MISS:"--miss", "혼조":"--note", "IN-LINE":"--sub"};
function formatWhy(text){
  if (!text) return "";
  let body = text;
  let verdictHtml = "";
  const m = body.match(/^\[(BEAT|MISS|혼조|IN-LINE)\]\s*/);
  if (m){
    const tag = m[1];
    verdictHtml = `<span class="sig-verdict" style="color:var(${VERDICT_VAR[tag]||"--sub"})">${VERDICT_LABEL[tag]||tag}</span><br>`;
    body = body.slice(m[0].length);
  }
  return verdictHtml + body.replace(/\n/g, "<br>");
}

function renderClusterCard(c, compact){
  const targetsHtml = (c.targets||[]).map(t=>`<span class="sig-target">${t}</span>`).join("");
  const sources = Array.isArray(c.sources) ? c.sources : [];
  const updates = Array.isArray(c.updates) ? c.updates : [];

  const sourcesHtml = sources.length
    ? `<details class="sig-sources">
        <summary>출처 ${sources.length}건 보기</summary>
        <div class="sig-source-list">
          ${sources.map(s=>`<div class="sig-source-item"><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a><br><span class="sig-source-meta">${s.source||""} · ${timeAgo(s.published_at)}</span></div>`).join("")}
        </div>
      </details>`
    : "";

  const timelineHtml = updates.length > 1
    ? `<details class="sig-timeline">
        <summary>업데이트 이력 ${updates.length}건</summary>
        <div class="sig-timeline-list">
          ${updates.slice().reverse().map(u=>`<div class="sig-timeline-item"><span class="sig-timeline-time">${kstTimeLabel(u.at)}</span>${formatWhy(u.note) || "새로 감지됨"}</div>`).join("")}
        </div>
      </details>`
    : "";

  return `
    <div class="sig-row${compact ? " sig-row-compact" : ""}">
      <div class="sig-top">
        <span class="sig-badge" style="background:var(${IMPACT_VAR[c.impact]||"--sub"})">${IMPACT_LABEL[c.impact]||"낮음"}</span>
        ${targetsHtml}
        <span class="sig-src">마지막 업데이트 ${kstTimeLabel(c.updated_at)}</span>
      </div>
      <div class="sig-title">${c.headline}</div>
      ${c.why ? `<div class="sig-why">${formatWhy(c.why)}</div>` : ""}
      ${timelineHtml}
      ${sourcesHtml}
    </div>`;
}

// 회사/섹터 그룹 안에 들어가는 사건 하나 — renderClusterCard와 거의 같지만, 그룹 카드 상단에
// 이미 대표 회사/섹터명(groupKey)이 나와 있으므로 그건 targets 칩에서 빼고 나머지만 보여줌
function renderSubItem(c, groupKey){
  const otherTargets = (c.targets||[]).filter(t=>t!==groupKey);
  const targetsHtml = otherTargets.map(t=>`<span class="sig-target">${t}</span>`).join("");
  const sources = Array.isArray(c.sources) ? c.sources : [];
  const updates = Array.isArray(c.updates) ? c.updates : [];

  const sourcesHtml = sources.length
    ? `<details class="sig-sources">
        <summary>출처 ${sources.length}건 보기</summary>
        <div class="sig-source-list">
          ${sources.map(s=>`<div class="sig-source-item"><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a><br><span class="sig-source-meta">${s.source||""} · ${timeAgo(s.published_at)}</span></div>`).join("")}
        </div>
      </details>`
    : "";

  const timelineHtml = updates.length > 1
    ? `<details class="sig-timeline">
        <summary>업데이트 이력 ${updates.length}건</summary>
        <div class="sig-timeline-list">
          ${updates.slice().reverse().map(u=>`<div class="sig-timeline-item"><span class="sig-timeline-time">${kstTimeLabel(u.at)}</span>${formatWhy(u.note) || "새로 감지됨"}</div>`).join("")}
        </div>
      </details>`
    : "";

  return `
    <div class="sig-subitem">
      <div class="sig-subitem-top">
        <span class="sig-badge sig-badge-sm" style="background:var(${IMPACT_VAR[c.impact]||"--sub"})">${IMPACT_LABEL[c.impact]||"낮음"}</span>
        ${targetsHtml}
        <span class="sig-src">${kstTimeLabel(c.updated_at)}</span>
      </div>
      <div class="sig-subitem-title">${c.headline}</div>
      ${c.why ? `<div class="sig-why">${formatWhy(c.why)}</div>` : ""}
      ${timelineHtml}
      ${sourcesHtml}
    </div>`;
}

// 회사/섹터 카드(2026-09-22 추가) — group.items는 이미 impact 우선순위로 정렬돼 들어옴
function renderGroupCard(group){
  const items = group.items;
  const bestImpact = items[0].impact;
  const latestIso = items.reduce((m,c)=> new Date(c.updated_at) > new Date(m) ? c.updated_at : m, items[0].updated_at);
  const subHtml = items.map(c=>renderSubItem(c, group.key)).join("");
  return `
    <div class="sig-group">
      <div class="sig-group-top">
        <span class="sig-badge" style="background:var(${IMPACT_VAR[bestImpact]||"--sub"})">${IMPACT_LABEL[bestImpact]||"낮음"}</span>
        <span class="sig-group-title">${group.key}</span>
        <span class="sig-group-count">${items.length}건</span>
        <span class="sig-src">최근 ${kstTimeLabel(latestIso)}</span>
      </div>
      <div class="sig-group-items">${subHtml}</div>
    </div>`;
}

// 회사/섹터 기준 카드 그룹핑(2026-09-22 추가): targets[0](대표 회사/섹터명, api/summarize.js가
// 이 순서를 보장함) 기준으로 클러스터를 묶어서 카드 하나 + 그 아래 사건별 서브 항목으로 보여줌.
// medium/high가 하나도 없는(전부 low인) 그룹은 카드로 따로 안 만들고, 기존처럼 "낮은 중요도"
// 묶음에 개별 항목으로 남김 — 사소한 내용까지 회사 카드로 다 만들면 카드 수가 오히려 안 줄어들기 때문.
function renderClusterList(elId, clusters, emptyMsg){
  const el = document.getElementById(elId);
  if (!clusters.length){ el.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }

  const order = {high:0, medium:1, low:2};
  const byImpactThenRecency = (a,b)=>{
    const bi = (order[a.impact]??3)-(order[b.impact]??3);
    if (bi !== 0) return bi;
    return new Date(b.updated_at) - new Date(a.updated_at);
  };

  const groupsMap = new Map();
  for (const c of clusters){
    const key = (c.targets && c.targets[0]) ? c.targets[0] : "기타";
    if (!groupsMap.has(key)) groupsMap.set(key, []);
    groupsMap.get(key).push(c);
  }

  const primaryGroups = [];
  const low = [];
  for (const [key, items] of groupsMap){
    if (items.some(c=>c.impact!=="low")){
      items.sort(byImpactThenRecency);
      primaryGroups.push({key, items});
    } else {
      low.push(...items);
    }
  }
  primaryGroups.sort((a,b)=>byImpactThenRecency(a.items[0], b.items[0]));
  low.sort(byImpactThenRecency);

  const primaryHtml = primaryGroups.length
    ? primaryGroups.map(g=>renderGroupCard(g)).join("")
    : `<div class="empty">눈에 띄는 시그널 없음</div>`;

  const lowHtml = low.length
    ? `<details class="sig-low-group"><summary>낮은 중요도 ${low.length}건 보기</summary>
        <div class="sig-low-list">${low.map(c=>renderClusterCard(c,true)).join("")}</div>
      </details>`
    : "";

  el.innerHTML = primaryHtml + lowHtml;
}

async function loadClusters(){
  const todayKey = kstDayKeyPadded(new Date().toISOString());
  const yestKey = kstDayKeyPadded(new Date(Date.now()-86400000).toISOString());
  const {data} = await sb.from("clusters").select("*").in("day_key", [todayKey, yestKey]).order("updated_at",{ascending:false});
  const rows = data || [];
  const today = rows.filter(c=>c.day_key===todayKey);
  const yesterday = rows.filter(c=>c.day_key===yestKey);
  renderClusterList("brief-today", today, `아직 생성된 브리핑 없음 — "브리핑 생성" 눌러서 만들어봐`);
  renderClusterList("brief-yesterday", yesterday, "기록 없음");
}
async function generateBriefing(){
  const btn = document.getElementById("brief-btn");
  const status = document.getElementById("brief-status");
  btn.disabled = true;
  status.textContent = "새 기사 확인하고 요약하는 중 (밀린 게 많으면 몇 분 걸릴 수 있음)…";
  try{
    const res = await fetch("/api/summarize", {method:"POST"});
    const json = await res.json();
    if (!res.ok){
      status.textContent = `오류: ${json.error || "알 수 없는 오류"}`;
      return;
    }
    if (json.skipped){
      status.textContent = json.message;
      return;
    }
    if (json.has_more_backlog){
      status.textContent = `${json.item_count}건 처리함(배치 ${json.batches_run}개) — 아직 밀린 게 더 있음, "브리핑 생성" 한번 더 눌러서 이어서 처리해줘`;
    } else {
      status.textContent = "";
    }
    await loadClusters();
  } catch(e){
    status.textContent = `오류: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}
document.getElementById("brief-btn").onclick = generateBriefing;
// ──────────────────────────────────────────────────────────

document.getElementById("kw-add-btn").onclick = addKeyword;
document.getElementById("tg-add-btn").onclick = addChannel;
document.getElementById("kw-input").addEventListener("keydown", e=>{if(e.key==="Enter")addKeyword();});
document.getElementById("tg-input").addEventListener("keydown", e=>{if(e.key==="Enter")addChannel();});
document.getElementById("search-input").addEventListener("input", e=>{searchTerm = e.target.value.toLowerCase(); renderFeed();});

function renderCatPills(){
  const el = document.getElementById("cat-pills");
  el.innerHTML = "";
  CATS.forEach(([key,label,varName])=>{
    const pill = document.createElement("div");
    pill.className = "cat-pill" + (activeCat===key ? " active" : "");
    pill.innerHTML = key==="all" ? `<span>${label}</span>` : `<span class="dot" style="background:var(${varName})"></span><span>${label}</span>`;
    pill.onclick = ()=>{ activeCat = key; renderCatPills(); renderFeed(); };
    el.appendChild(pill);
  });
}

function renderFeed(){
  let list = allItems;
  if (activeCat!=="all") list = list.filter(it=>it.category===activeCat);
  if (searchTerm) list = list.filter(it=>(it.title+it.summary).toLowerCase().includes(searchTerm));
  const el = document.getElementById("feed");
  if (!list.length){ el.innerHTML = `<div class="empty">해당하는 항목이 없음</div>`; return; }

  let html = "";
  let lastLabel = null;
  for (const it of list){
    const label = dayLabel(it.published_at);
    if (label !== lastLabel){ html += `<div class="day-label">${label}</div>`; lastLabel = label; }
    const catInfo = CATS.find(c=>c[0]===it.category) || CATS[CATS.length-1];
    html += `
      <div class="item">
        <div class="item-top">
          <span class="dot" style="background:var(${catInfo[2]})"></span>
          <span class="badge ${it.sentiment}">${it.sentiment}</span>
          <span class="item-src">${it.source||""} · ${timeAgo(it.published_at)}</span>
        </div>
        <div class="item-title"><a href="${it.url}" target="_blank" rel="noopener">${it.title}</a></div>
        ${it.summary ? `<div class="item-sum">${it.summary}</div>` : ""}
      </div>`;
  }
  el.innerHTML = html;
}

async function loadItems(){
  const {data} = await sb.from("items").select("*").order("published_at",{ascending:false}).limit(300);
  allItems = data || [];
  renderFeed();
}
async function loadStatus(){
  const {data} = await sb.from("status").select("*").eq("id",1).single();
  document.getElementById("last-updated").textContent = data?.last_run_at
    ? `마지막 수집: ${kstFullLabel(data.last_run_at)}`
    : "마지막 수집 정보 없음";
  return data;
}

async function init(){
  renderCatPills();
  await Promise.all([loadKeywords(), loadChannels(), loadItems(), loadClusters()]);
  await loadStatus();

  // 실시간 구독 — DB에 새 행이 쓰이는 즉시 화면 반영 (수집 자체는 GitHub Actions가 5분 주기로 폴링)
  sb.channel("public:items")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"items"}, payload=>{
      allItems = [payload.new, ...allItems.filter(it=>it.id!==payload.new.id)];
      renderFeed();
    })
    .subscribe();

  sb.channel("public:status")
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"status"}, payload=>{
      document.getElementById("last-updated").textContent = `마지막 수집: ${kstFullLabel(payload.new.last_run_at)}`;
    })
    .subscribe();

  sb.channel("public:clusters")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"clusters"}, loadClusters)
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"clusters"}, loadClusters)
    .subscribe();

  sb.channel("public:config")
    .on("postgres_changes", {event:"*", schema:"public", table:"keywords"}, loadKeywords)
    .on("postgres_changes", {event:"*", schema:"public", table:"telegram_channels"}, loadChannels)
    .subscribe();

  setInterval(renderFeed, 30000); // "n분 전" 텍스트 갱신용
}
init();
</script>

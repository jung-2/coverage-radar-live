<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>커버리지 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7; --text:#1A1A18; --sub:#6B6A63; --border:#E8E8E8;
    --stat:#F5F4ED; --block:#FFFFFF; --headerbg:#FFFFFFEE; --pillbg:#F0EFE8; --hover:#F0EFE8;
    --beat:#1D9E75; --miss:#D64545; --note:#D18F2E; --info:#2F7DD1;
    --cat-packaging:#8B5CF6; --cat-hbm:#12977F; --cat-cpo:#2F7DD1; --cat-power:#D18F2E;
    --cat-ai_server:#5C6BC0; --cat-korea:#C0392B; --cat-biotech:#C2478E;
    --cat-disclosure:#8A8578; --cat-telegram:#2AA8C7; --cat-other:#9C9891;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15140F; --text:#EDEAE0; --sub:#9C9891; --border:#33322A;
      --stat:#201F19; --block:#1B1A15; --headerbg:#15140FEE; --pillbg:#221F17; --hover:#26241C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15140F; --text:#EDEAE0; --sub:#9C9891; --border:#33322A;
    --stat:#201F19; --block:#1B1A15; --headerbg:#15140FEE; --pillbg:#221F17; --hover:#26241C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.5;}
  a{color:inherit;}
  .top{position:sticky;top:0;z-index:10;background:var(--headerbg);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;}
  .brand{font-weight:700;font-size:15px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--beat);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .meta{color:var(--sub);font-size:11px;margin-left:auto;}
  .wrap{max-width:920px;margin:0 auto;padding:14px 16px 60px;}
  .sec{font-size:13px;font-weight:600;margin:0;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:flex;align-items:center;gap:5px;background:var(--pillbg);border-radius:14px;padding:4px 10px;font-size:11px;}
  .chip button{border:none;background:none;color:var(--sub);cursor:pointer;font-size:12px;padding:0;line-height:1;}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .cat-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:14px;background:var(--pillbg);font-size:11px;cursor:pointer;border:1px solid transparent;}
  .cat-pill.active{border-color:var(--info);}
  .dot{width:7px;height:7px;border-radius:50%;}
  #search-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--block);color:var(--text);font-size:12px;font-family:inherit;margin-bottom:10px;}
  .day-label{font-size:11px;color:var(--sub);font-weight:600;margin:14px 0 6px;}
  .item{background:var(--block);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
  .item-top{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
  .badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:600;}
  .badge.beat{background:var(--beat);color:#fff;}
  .badge.miss{background:var(--miss);color:#fff;}
  .badge.note{background:var(--note);color:#fff;}
  .badge.neutral{background:var(--sub);color:#fff;}
  .item-title{font-size:13px;font-weight:500;}
  .item-title a{text-decoration:none;}
  .item-title a:hover{text-decoration:underline;}
  .item-src{font-size:10px;color:var(--sub);}
  .item-sum{font-size:11.5px;color:var(--sub);margin-top:4px;}
  .empty{color:var(--sub);font-size:12px;padding:8px 0;}

  /* 브리핑 히어로 섹션 */
  .hero{background:var(--block);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .hero-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .hero-head button{font-size:12px;padding:7px 14px;border:none;border-radius:6px;background:var(--info);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;}
  .hero-head button:disabled{opacity:.5;cursor:default;}
  .brief-status{color:var(--sub);font-size:11px;min-height:14px;margin-bottom:6px;}
  .day-group{margin-top:14px;}
  .day-title{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
  /* '어제' 섹션 기본 접힘용(2026-09-23 추가) — .sig-low-group과 동일한 화살표 패턴 재사용 */
  .day-group-collapse{margin-top:14px;}
  .day-group-collapse summary{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;list-style:none;margin-bottom:8px;}
  .day-group-collapse summary::-webkit-details-marker{display:none;}
  .day-group-collapse summary::before{content:"▸ ";}
  .day-group-collapse[open] summary::before{content:"▾ ";}
  /* 텔레그램/추적키워드 2탭(2026-09-23 추가, 2026-09-29 시황탭 제거) */
  .tab-nav{display:flex;gap:4px;margin-top:10px;border-bottom:1px solid var(--border);}
  .tab-btn{font-family:inherit;font-size:12px;font-weight:600;padding:7px 12px;border:none;background:transparent;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--info);border-bottom-color:var(--info);}
  .sig-row{background:var(--stat);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .sig-row:last-child{margin-bottom:0;}
  .sig-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;}
  .sig-badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;color:#fff;letter-spacing:.02em;}
  .sig-target{font-size:10px;background:var(--pillbg);border-radius:10px;padding:2px 8px;color:var(--text);}
  .sig-src{font-size:10px;color:var(--sub);margin-left:auto;white-space:nowrap;}
  .sig-title{font-size:12.5px;font-weight:500;}
  .sig-title a{text-decoration:none;}
  .sig-title a:hover{text-decoration:underline;}
  .sig-why{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.65;}
  .sig-row-compact .sig-title{font-size:11.5px;font-weight:400;}
  /* 업데이트 누른 순간 구분선(2026-09-29 추가) */
  .round-divider{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:11px;font-weight:700;color:var(--info);}
  .round-divider::before,.round-divider::after{content:"";flex:1;height:1px;background:var(--info);opacity:.45;}
  .round-divider:first-child{margin-top:4px;}
  .sig-low-group{background:var(--block);border:1px solid var(--border);border-radius:8px;margin-top:2px;}
  .sig-low-group summary{padding:8px 12px;font-size:11px;color:var(--info);cursor:pointer;list-style:none;}
  .sig-low-group summary::-webkit-details-marker{display:none;}
  .sig-low-group summary::before{content:"▸ ";}
  .sig-low-group[open] summary::before{content:"▾ ";}
  .sig-low-list{padding:0 12px 8px;}
  .sig-low-list .sig-row{background:transparent;border-bottom:1px solid var(--border);border-radius:0;padding:7px 0;margin-bottom:0;}
  .sig-low-list .sig-row:last-child{border-bottom:none;}
  .sig-timeline{margin-top:6px;}
  .sig-timeline summary{font-size:10.5px;color:var(--info);cursor:pointer;list-style:none;}
  .sig-timeline summary::-webkit-details-marker{display:none;}
  .sig-timeline summary::before{content:"▸ ";}
  .sig-timeline[open] summary::before{content:"▾ ";}
  .sig-timeline-list{margin-top:5px;display:flex;flex-direction:column;gap:5px;}
  .sig-timeline-item{font-size:11px;color:var(--sub);line-height:1.5;}
  .sig-timeline-time{font-weight:700;color:var(--text);margin-right:4px;}
  .sig-sources{margin-top:6px;}
  .sig-sources summary{font-size:10.5px;color:var(--info);cursor:pointer;list-style:none;}
  .sig-sources summary::-webkit-details-marker{display:none;}
  .sig-sources summary::before{content:"▸ ";}
  .sig-sources[open] summary::before{content:"▾ ";}
  .sig-source-list{margin-top:5px;display:flex;flex-direction:column;gap:6px;}
  .sig-source-item{font-size:11px;}
  .sig-source-item a{text-decoration:none;}
  .sig-source-item a:hover{text-decoration:underline;}
  .sig-source-meta{color:var(--sub);font-size:10px;}
  /* 회사/섹터 기준 그룹 카드 (2026-09-22 추가): targets[0](대표 회사/섹터명) 기준으로 묶어서
     상위 카드 하나 + 그 아래 사건별 서브 항목으로 보여줌 */
  .sig-group{background:var(--stat);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .sig-group:last-child{margin-bottom:0;}
  .sig-group-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;}
  .sig-group-title{font-size:13px;font-weight:700;}
  .sig-group-count{font-size:10px;color:var(--sub);background:var(--pillbg);border-radius:10px;padding:1px 7px;}
  .sig-group-items{display:flex;flex-direction:column;gap:6px;}
  .sig-subitem{background:var(--block);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
  .sig-subitem-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;}
  .sig-badge-sm{font-size:8px;padding:1px 5px;}
  .sig-subitem-title{font-size:12px;font-weight:500;}
  .sig-verdict{font-size:11px;font-weight:800;letter-spacing:.02em;}

  /* 접이식 보조 섹션 */
  .collapse-box{background:var(--block);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;}
  .collapse-box>summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .collapse-box>summary::-webkit-details-marker{display:none;}
  .collapse-box>summary::before{content:"▸";color:var(--sub);}
  .collapse-box[open]>summary::before{content:"▾";}
  .collapse-box[open]>summary{border-bottom:1px solid var(--border);}
  .collapse-body{padding:12px;}
  .kw-row{display:flex;gap:6px;margin-bottom:8px;}
  .kw-row input{flex:1;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;}
  .kw-row button{font-size:12px;padding:6px 12px;border:none;border-radius:6px;background:var(--info);color:#fff;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
  <div class="top">
    <span class="live-dot" id="live-dot"></span>
    <span class="brand">커버리지 레이더</span>

  <div class="wrap">

        <div id="brief-today"><div class="empty">아직 생성된 업데이트 없음 — "업데이트" 눌러서 만들어봐</div></div>
      </div>

      </details>

    <details class="collapse-box">
      <summary>추적 키워드 관리</summary>

        <div class="kw-row">
          <input id="kw-input" placeholder="종목명·회사명·테마 추가 (예: SK하이닉스)" />

          <button id="tg-add-btn">추가</button>
        </div>
        <div class="chips" id="tg-list"></div>
      </div>
    </details>

    <details class="collapse-box">
      <summary>전체 피드</summary>
      <div class="collapse-body">
        <input id="search-input" placeholder="제목·요약 검색…" />
        <div class="cats" id="cat-pills"></div>
        <div id="feed"><div class="empty">데이터 로딩 중…</div></div>
      </div>
    </details>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATS = [
  ["all","전체","--sub"],
  ["packaging","패키징","--cat-packaging"],
  ["hbm","HBM","--cat-hbm"],
  ["cpo","CPO/광","--cat-cpo"],
  ["power","전력반도체","--cat-power"],

  ["korea","한국주식","--cat-korea"],
  ["biotech","바이오","--cat-biotech"],
  ["disclosure","공시","--cat-disclosure"],
  ["telegram","텔레그램","--cat-telegram"],
  ["other","기타","--cat-other"],
];

let allItems = [];
let activeCat = "all";
let searchTerm = "";

function extractHandle(v){
  v = v.trim().replace(/^https?:\/\/t\.me\//i,"").replace(/^@/,"").replace(/^s\//,"");
  return v.split(/[/?]/)[0];
}

function timeAgo(iso){
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  if (diff < 60) return "방금 전";
  if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
  return `${Math.floor(diff/86400)}일 전`;
}

// KST(UTC+9) 기준 날짜/시간 — 접속 브라우저 시간대와 무관하게 항상 한국시간 기준으로 계산
function toKST(iso){
  return new Date(new Date(iso).getTime() + 9*3600*1000); // UTC로 저장된 값을 KST wall-clock으로 이동
}
function kstDateKey(iso){
  const k = toKST(iso);
  return `${k.getUTCFullYear()}-${k.getUTCMonth()}-${k.getUTCDate()}`;
}
function kstTimeLabel(iso){
  const k = toKST(iso);
  return `${String(k.getUTCHours()).padStart(2,"0")}:${String(k.getUTCMinutes()).padStart(2,"0")}`;
}
function kstFullLabel(iso){
  const k = toKST(iso);
  return `${k.getUTCMonth()+1}월 ${k.getUTCDate()}일 ${String(k.getUTCHours()).padStart(2,"0")}:${String(k.getUTCMinutes()).padStart(2,"0")} KST`;
}
// 클러스터의 day_key('YYYY-MM-DD', KST 기준)와 맞춰 비교하기 위한 자리수 고정 버전
function kstDayKeyPadded(iso){
  const k = toKST(iso);
  const y = k.getUTCFullYear();
  const m = String(k.getUTCMonth()+1).padStart(2,"0");
  const d = String(k.getUTCDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

// 'YYYY-MM-DD' day_key를 "9월 23일" 형태로(2026-09-23 추가) — 오늘/어제 라벨 옆 날짜 표시용
function monthDayLabel(dayKey){
  const [, m, d] = dayKey.split("-").map(Number);
  return `${m}월 ${d}일`;
}

function dayLabel(iso){
  const d = new Date(iso), now = new Date();
  const sameDay = (a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if (sameDay(d, now)) return "오늘";
  if (sameDay(d, yest)) return "어제";
  return d.toLocaleDateString("ko-KR",{month:"long",day:"numeric"});
}

async function loadKeywords(){
  const {data} = await sb.from("keywords").select("term").order("term");
  renderChips("kw-list", (data||[]).map(r=>r.term), removeKeyword);
}
async function loadChannels(){
  const {data} = await sb.from("telegram_channels").select("handle").order("handle");
  renderChips("tg-list", (data||[]).map(r=>r.handle), removeChannel);
}
function renderChips(elId, list, onRemove){
  const el = document.getElementById(elId);
  el.innerHTML = list.length ? "" : `<span class="empty" style="padding:0;">아직 없음</span>`;
  list.forEach(v=>{
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span>${v}</span>`;
    const btn = document.createElement("button");
    btn.textContent = "✕";
    btn.onclick = ()=>onRemove(v);
    chip.appendChild(btn);
    el.appendChild(chip);
  });
}
async function addKeyword(){
  const input = document.getElementById("kw-input");
  const v = input.value.trim();
  if (!v) return;
  await sb.from("keywords").insert({term:v});
  input.value = "";
  loadKeywords();
}
async function removeKeyword(term){
  await sb.from("keywords").delete().eq("term", term);
  loadKeywords();
}
async function addChannel(){
  const input = document.getElementById("tg-input");
  const v = extractHandle(input.value);
  if (!v) return;
  await sb.from("telegram_channels").insert({handle:v});
  input.value = "";
  loadChannels();
}
async function removeChannel(handle){
  await sb.from("telegram_channels").delete().eq("handle", handle);
  loadChannels();
}

// ── 브리핑(클러스터) ──────────────────────────────────────
// "브리핑 생성"을 여러 번 눌러도 같은 주제는 새 카드로 또 쌓이지 않고, 기존 카드가
// 갱신되면서 그 안에 시간별 업데이트 이력이 쌓이는 구조. 카드 하나 = 클러스터 하나.
const IMPACT_LABEL = {high:"높음", medium:"중간", low:"낮음"};
const IMPACT_VAR = {high:"--miss", medium:"--note", low:"--sub"};

// note/why 텍스트 맨 앞의 "[BEAT]"/"[MISS]"/"[혼조]"/"[IN-LINE]" 마커를 색깔 뱃지로 바꾸고,
// 줄바꿈(\n)을 <br>로 바꿔줌 — 리포트 요약(2026-09-22 추가)이 여러 줄로 오는 걸 그대로 보여주기 위함
const VERDICT_LABEL = {BEAT:"BEAT", MISS:"MISS", "혼조":"혼조", "IN-LINE":"IN-LINE"};
const VERDICT_VAR = {BEAT:"--beat", MISS:"--miss", "혼조":"--note", "IN-LINE":"--sub"};
function formatWhy(text){
  if (!text) return "";
  let body = text;
  let verdictHtml = "";
  const m = body.match(/^\[(BEAT|MISS|혼조|IN-LINE)\]\s*/);
  if (m){
    const tag = m[1];
    verdictHtml = `<span class="sig-verdict" style="color:var(${VERDICT_VAR[tag]||"--sub"})">${VERDICT_LABEL[tag]||tag}</span><br>`;
    body = body.slice(m[0].length);
  }
  return verdictHtml + body.replace(/\n/g, "<br>");
}

function renderClusterCard(c, compact){

// 회사/섹터 카드(2026-09-22 추가) — group.items는 이미 impact 우선순위로 정렬돼 들어옴
function renderGroupCard(group){
  const items = group.items;
  const bestImpact = items[0].impact;
  const latestIso = items.reduce((m,c)=> new Date(c.updated_at) > new Date(m) ? c.updated_at : m, items[0].updated_at);

// 회사/섹터 기준 카드 그룹핑(2026-09-22 추가): targets[0](대표 회사/섹터명, api/summarize.js가
// 이 순서를 보장함) 기준으로 클러스터를 묶어서 카드 하나 + 그 아래 사건별 서브 항목으로 보여줌.
// medium/high가 하나도 없는(전부 low인) 그룹은 카드로 따로 안 만들고, 기존처럼 "낮은 중요도"
// 묶음에 개별 항목으로 남김 — 사소한 내용까지 회사 카드로 다 만들면 카드 수가 오히려 안 줄어들기 때문.
function renderClusterList(elId, clusters, emptyMsg){
  document.getElementById(elId).innerHTML = clusterListHtml(clusters, emptyMsg);
}
function clusterListHtml(clusters, emptyMsg){
  if (!clusters.length) return `<div class="empty">${emptyMsg}</div>`;

  const order = {high:0, medium:1, low:2};
  const byImpactThenRecency = (a,b)=>{
    const bi = (order[a.impact]??3)-(order[b.impact]??3);
    if (bi !== 0) return bi;
    return new Date(b.updated_at) - new Date(a.updated_at);
  };
  // 카드(그룹) 하나가 가장 최근에 받은 업데이트 시각 — 그룹 내부 아이템 중 최댓값(2026-09-23 추가)
  const groupLatestUpdatedAt = (items) => items.reduce(
    (max, c) => { const t = new Date(c.updated_at).getTime(); return t > max ? t : max; }, 0
  );

  const groupsMap = new Map();
  for (const c of clusters){
    const key = (c.targets && c.targets[0]) ? c.targets[0] : "기타";
    if (!groupsMap.has(key)) groupsMap.set(key, []);
    groupsMap.get(key).push(c);
  }

  const primaryGroups = [];
  const low = [];
  for (const [key, items] of groupsMap){
    if (items.some(c=>c.impact!=="low")){
      items.sort(byImpactThenRecency);
      primaryGroups.push({key, items});
    } else {
      low.push(...items);
    }
  }
  // 상단 카드 순서(2026-09-23 변경): impact 우선순위가 아니라 "이 카드가 가장 최근에
  // 업데이트된 순"으로 정렬 — 업데이트 누를 때마다 방금 바뀐 카드가 맨 위로 오게 하기 위함.
  // 카드 내부 개별 항목 순서(items.sort 위)는 기존대로 impact 우선 유지.
  primaryGroups.sort((a,b)=>groupLatestUpdatedAt(b.items) - groupLatestUpdatedAt(a.items));
  low.sort(byImpactThenRecency); // low 안은 전부 impact가 같으므로(=low) 사실상 이미 시간순

  const primaryHtml = primaryGroups.length
    ? primaryGroups.map(g=>renderGroupCard(g)).join("")
    : `<div class="empty">눈에 띄는 시그널 없음</div>`;

  const lowHtml = low.length
    ? `<details class="sig-low-group"><summary>낮은 중요도 ${low.length}건 보기</summary>
        <div class="sig-low-list">${low.map(c=>renderClusterCard(c,true)).join("")}</div>
      </details>`
    : "";

  return primaryHtml + lowHtml;
}

// ── 업데이트를 누른 순간별로 나눠서 보기(2026-09-29 추가) ─────────────
// summarize.js가 기사(sources)와 요약 메모(updates)에 run_at(버튼 누른 시각)을 붙여 저장함.
// 클러스터 하나를 run_at별로 쪼갠 "가상 클러스터"(그 순간에 새로 들어온 기사/메모만 담음)를 만들어서
// 누른 순간마다 줄(구분선)을 긋고 그 아래에 그때 바뀐 카드만 보여줌. 같은 회사 카드가 여러 번
// 업데이트됐으면 누른 순간마다 따로 나옴. run_at이 없는 예전 기록은 맨 아래 "이전 기록"에 모아둠.
function roundLabel(iso, dayKey){
  const t = kstTimeLabel(iso);
  return kstDayKeyPadded(iso) === dayKey ? t : `${monthDayLabel(kstDayKeyPadded(iso))} ${t}`;
}
function roundDividerHtml(text){
  return `<div class="round-divider"><span>${text}</span></div>`;
}
function roundListHtml(clusters, emptyMsg, dayKey){
  if (!clusters.length) return `<div class="empty">${emptyMsg}</div>`;
  const rounds = new Map(); // run_at -> 가상 클러스터[]
  const legacy = [];
  const maxPub = (arr, fallback) => arr.reduce((m,x)=> x.published_at && new Date(x.published_at) > new Date(m) ? x.published_at : m, fallback);
  for (const c of clusters){
    const sources = Array.isArray(c.sources) ? c.sources : [];
    const updates = Array.isArray(c.updates) ? c.updates : [];
    const runs = new Set([...sources, ...updates].map(x=>x.run_at).filter(Boolean));
    const oldSources = sources.filter(x=>!x.run_at), oldUpdates = updates.filter(x=>!x.run_at);
    if (!runs.size || oldSources.length || oldUpdates.length){
      const oldNote = oldUpdates.length ? oldUpdates[oldUpdates.length-1].note : (runs.size ? "" : c.why);
      legacy.push({...c, sources: oldSources, updates: oldUpdates, why: oldNote, updated_at: maxPub(oldSources, c.updated_at)});
    }
    for (const r of runs){
      const rs = sources.filter(x=>x.run_at===r), ru = updates.filter(x=>x.run_at===r);
      const note = ru.map(u=>u.note).filter(n=>n && n!=="새로 감지됨").join(" / ");
      rounds.set(r, [...(rounds.get(r)||[]), {...c, sources: rs, updates: ru, why: note, updated_at: maxPub(rs, c.updated_at)}]);
    }
  }
  const runKeys = [...rounds.keys()].sort((a,b)=> new Date(b) - new Date(a));
  let html = runKeys.map(r=>{
    const list = rounds.get(r);
    const nSrc = list.reduce((n,c)=>n + c.sources.length, 0);
    return roundDividerHtml(`${roundLabel(r, dayKey)} 업데이트 · 카드 ${list.length}개 · 기사 ${nSrc}건`) + clusterListHtml(list, "");
  }).join("");
  if (legacy.length) html += roundDividerHtml(`이전 기록 (누른 시각 구분 없음) · 카드 ${legacy.length}개`) + clusterListHtml(legacy, "");
  return html;
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function safeUrl(u){ return /^https?:\/\//i.test(u || "") ? esc(u) : "#"; }
function bigramSet(s){
  const clean = String(s || "").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
  const set = new Set();
  for (let i = 0; i < clean.length - 1; i++) set.add(clean.slice(i, i + 2));
  return set;
}
function diceSim(A, B){
  if (!A.size || !B.size) return 0;
  let inter = 0;
  for (const g of A) if (B.has(g)) inter++;
  return (2 * inter) / (A.size + B.size);
}

];
// 잡음 — 걸리면 점수를 0 이하로 눌러버림(중요한 척 하는 글/무관한 글)
const KW_NOISE = /투자분석|주가 ?전망|추천주|종목 ?추천|리딩방|무료 ?상담|마켓딥다이브|초고수|인생을 ?바꿨|N샷|미모|각선미|화보|야구|위닝|가을야구|마작|쿠폰|경품|이벤트|봉사|기부|캠퍼스|소비자평가|대상 수상|우수협력사|운세|팁 결과/;
// 주가가 ±5% 이상 움직였다는 기사 감지(제목 기준 — 실제 시세가 아니라 기사가 그렇게 썼다는 뜻).
// "방향 단어 + 숫자%" 또는 "숫자% + 방향 단어"를 찾고, 제목에 주가 관련 단어가 같이 있을 때만 인정.
// 목표가/영업이익/매출 같은 % ("목표가 20%↑")는 주가 등락이 아니므로 제외. 여러 개면 제목에서 가장 뒤에 나온 것 사용
// (예: "5%대 급락했던 삼성전자, 배당락에도 0.9% 상승 마감" → 0.9% 상승).
const KW_PRICE_CTX = /주가|장중|장마감|특징주|급등|급락|상한가|하한가|수급포착|애프터마켓|프리마켓|거래일/;
const KW_UP_TEST = /^(급등|상승|↑|강세|올라|오른|\+)$/;
const KW_NOT_PRICE = /전날|전일|지난|목표|추정|전망|영업|매출|이익|수익|증가|성장|점유|비중|지분|금리|환율|수출|물량/;
const KW_MOVE_A = /(급등|상승|↑|강세|올라|오른|\+|급락|하락|↓|약세|내려|내린|떨어|-)\s*(\d{1,3}(?:\.\d+)?)\s*%/g;
const KW_MOVE_B = /(\d{1,3}(?:\.\d+)?)\s*%(?:대)?\s*(?:이상|넘게)?\s*(급등|상승|↑|강세|올라|오른|급락|하락|↓|약세|내려|내린|떨어)/g;
function kwPriceMove(t, keyword){
  if (!KW_PRICE_CTX.test(t)) return null;
  const upRe = KW_UP_TEST;
  const found = [];
  const push = (index, pct, word) => {
    if (KW_NOT_PRICE.test(t.slice(Math.max(0, index - 10), index))) return;
    found.push({index, pct: parseFloat(pct), up: upRe.test(word)});
  };
  for (const m of t.matchAll(KW_MOVE_A)) push(m.index, m[2], m[1]);
  for (const m of t.matchAll(KW_MOVE_B)) push(m.index, m[1], m[2]);
  if (!found.length) return null;
  found.sort((a, b) => a.index - b.index);
  // 제목에 여러 종목이 나오면("HPSP 7.68% 급등, 에코프로비엠 5.57% 하락") 이 회사 이름 바로 뒤에 나온 숫자를 우선,
  // 이름 위치를 모르거나 뒤에 없으면 제목에서 가장 뒤에 나온 것
  const at = keyword ? t.toLowerCase().indexOf(String(keyword).toLowerCase()) : -1;
  const after = at >= 0 ? found.filter(f => f.index >= at) : [];
  const last = after.length ? after[0] : found[found.length - 1];
  return Math.abs(last.pct) >= 5 ? (last.up ? 1 : -1) * Math.round(last.pct * 10) / 10 : null;
}
function kwScoreTitle(title, keyword){
  const t = String(title || "");
  let best = null, hits = 0;
  for (const [re, score, tag, pol] of KW_RULES){
    if (re.test(t)){
      hits++;
      if (!best || score > best.score || (score === best.score && best.pol === "neu" && pol !== "neu")) best = {score, tag, pol};
    }
  }
  // 주가 급등락(±5% 이상) — 기사 제목에 그렇게 적혀 있을 때
  const move = kwPriceMove(t, keyword);
  if (move !== null && (!best || best.score < 2)) best = {score: 2, tag: (move > 0 ? "급등 +" : "급락 ") + move + "%", pol: move > 0 ? "pos" : "neg"};
  let score = best ? best.score : 0;
  if (best && hits > 1) score += 0.5;                           // 여러 종류의 중요 단어가 겹치면 조금 더
  if (best && /\d+(?:\.\d+)?\s*조|\d{3,}(?:,\d{3})*\s*억/.test(t)) score += 1; // 100억원 이상 규모 숫자가 나오면 더
  if (KW_NOISE.test(t)) score = Math.min(score, 0);
  return {score, tag: best && score > 0 ? best.tag : "", pol: best ? best.pol : "neu", move: score > 0 ? move : null};
}

// 기사 중요도 점수 → 등급: 3.5 이상 핵심, 2 이상 중요, 나머지 일반(3.5 = 금액 100억 이상이거나 여러 신호가 겹친 재료)
const kwTier = score => score >= 3.5 ? "high" : score >= 2 ? "medium" : "normal";
const KW_TIER_LABEL = {high:"핵심", medium:"중요"};
const KW_POL_VAR = {pos:"--beat", neg:"--miss", neu:"--info"};

// 회사(keyword_match)별로 묶고 → 회사 안에서 제목 비슷한 기사끼리 묶고 → 중요도 순으로 정렬.
// 묶음의 대표 기사는 "점수 가장 높은 것"(같으면 최신). 여러 매체(3곳 이상)가 다룬 뉴스는 +1(큰 뉴스일 가능성).
// 회사 순서: 핵심 → 중요 → 일반 등급 순, 같은 등급이면 최근 기사가 있는 회사가 위.
// (KIS 시세 연동 시: 장중 급등 종목이면 여기 회사 점수에 가산하면 됨)
// KIS 시세(price_moves 테이블, scraper/prices.mjs가 장중 5분마다 갱신): {회사(키워드) → 오늘 등락률(%)}.
// 이 값이 있는 종목은 KIS 기준으로 ±5% 이상이면 "급등락 종목" 구역에 올라가고(오늘 기사가 없어도 카드가 뜸),
// 5% 미만이면 기사 제목이 뭐라고 했든 급등락에서 뺌. KIS에 없는 종목(해외/테마 등)은 기사 제목 기준으로 대신함.
const KW_MOVE_MIN = 5;
let kisMoves = new Map();
let kisAt = null; // 가장 최근 시세 갱신 시각
const kisMoverCount = () => [...kisMoves.values()].filter(p => Math.abs(p) >= KW_MOVE_MIN).length;

function groupKeywordItems(items){
  const byKw = new Map();
  for (const it of items){
    if (!it._kw) it._kw = kwScoreTitle(it.title, it.keyword_match);
    if (!byKw.has(it.keyword_match)) byKw.set(it.keyword_match, []);
    byKw.get(it.keyword_match).push(it);
  }
  const groups = [];
  for (const [key, list] of byKw){
    list.sort((a,b)=> new Date(b.published_at) - new Date(a.published_at));
    const clusters = []; // {rep, bg, members, score}
    for (const it of list){
      const bg = bigramSet(it.title);
      const hit = clusters.find(c => diceSim(bg, c.bg) >= KW_SIMILAR);
      if (hit) hit.members.push(it); else clusters.push({rep: it, bg, members: [it]});
    }
    for (const c of clusters){
      // 대표 = 점수 최고(같으면 최신 — members는 이미 최신순이라 처음 나온 것)
      c.rep = c.members.reduce((best, m)=> m._kw.score > best._kw.score ? m : best, c.members[0]);
      const nSrc = new Set(c.members.map(m=>m.source)).size;
      c.score = c.rep._kw.score > 0 ? c.rep._kw.score + (nSrc >= 3 ? 1 : 0) : 0;
    }
    clusters.sort((a,b)=> (b.score - a.score) || (new Date(b.members[0].published_at) - new Date(a.members[0].published_at)));
    // 급등락: KIS 시세가 있으면 그 값, 없으면 가장 최근에 "±5% 이상 움직였다"고 쓴 기사 제목 기준(list는 최신순)
    const mv = list.find(it => it._kw.move != null);
    const kis = kisMoves.get(key);
    groups.push({key, clusters, count: list.length, latest: list[0].published_at, score: clusters[0].score,
      move: kis !== undefined ? (Math.abs(kis) >= KW_MOVE_MIN ? Math.round(kis * 10) / 10 : null) : (mv ? mv._kw.move : null),
      moveSrc: kis !== undefined ? "kis" : "news"});
  }
  const rank = {high:0, medium:1, normal:2};
  groups.sort((a,b)=> (rank[kwTier(a.score)] - rank[kwTier(b.score)]) || (new Date(b.latest) - new Date(a.latest)));
  return groups;
}

function renderKeywordCluster(c){
  const rep = c.rep;
  let badge = "";
  if (c.score >= 2 && rep._kw.tag){
    badge = `<span class="sig-badge sig-badge-sm" style="background:var(${KW_POL_VAR[rep._kw.pol]||"--info"})">${esc(rep._kw.tag)}</span>`;
  } else {
    const sent = KW_SENT[rep.sentiment];
    if (sent) badge = `<span class="sig-badge sig-badge-sm" style="background:var(${sent[1]})">${sent[0]}</span>`;
  }
  const srcs = [...new Set(c.members.map(m=>m.source || "Google News"))];
  const srcText = srcs.length > 1 ? `${esc(srcs[0])} 외 ${srcs.length-1}곳` : esc(srcs[0]);
  const others = c.members.filter(m=>m!==rep);
  const moreHtml = others.length
    ? `<details class="sig-sources">
        <summary>비슷한 기사 ${others.length}건 보기</summary>
        <div class="sig-source-list">
          ${others.map(m=>`<div class="sig-source-item"><a href="${safeUrl(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a><br><span class="sig-source-meta">${esc(m.source||"")} · ${timeAgo(m.published_at)}</span></div>`).join("")}
        </div>
      </details>`
    : "";
  return `
    <div class="sig-subitem">
      <div class="sig-subitem-top">${badge}<span class="sig-source-meta">${srcText}</span><span class="sig-src">${kstTimeLabel(rep.published_at)}</span></div>
      <div class="sig-subitem-title"><a href="${safeUrl(rep.url)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(rep.title)}</a></div>
      ${moreHtml}
    </div>`;
}

function renderKeywordGroupCard(g, topN = KW_TOP_CLUSTERS){
  const tier = kwTier(g.score);
  const tierBadge = KW_TIER_LABEL[tier]
    ? `<span class="sig-badge" style="background:var(${IMPACT_VAR[tier]||"--sub"})">${KW_TIER_LABEL[tier]}</span>`
    : "";
  const moveChip = g.move != null
    ? `<span class="sig-badge" title="${g.moveSrc === "kis" ? "KIS 시세 기준" : "기사 제목 기준(실제 시세 아님)"}" style="background:var(${g.move > 0 ? "--beat" : "--miss"})">${g.move > 0 ? "▲ +" : "▼ "}${g.move}%</span>`
    : "";
  const shown = g.clusters.length
    ? g.clusters.slice(0, topN).map(renderKeywordCluster).join("")
    : `<div class="empty">오늘 관련 기사 없음</div>`;
  const rest = g.clusters.slice(topN);
  const restHtml = rest.length
    ? `<details class="sig-sources"><summary>나머지 ${rest.length}건 보기</summary><div class="sig-group-items" style="margin-top:6px">${rest.map(renderKeywordCluster).join("")}</div></details>`
    : "";
  return `
    <div class="sig-group">
      <div class="sig-group-top">
        ${tierBadge}
        <span class="sig-group-title">${esc(g.key)}</span>
        ${moveChip}
        <span class="sig-group-count">${g.count}건</span>
        ${g.latest ? `<span class="sig-src">최근 ${kstTimeLabel(g.latest)}</span>` : ""}
      </div>
      <div class="sig-group-items">${shown}${restHtml}</div>
    </div>`;
}

// 맨 위: 급등/급락(±5% 이상) 종목의 회사 카드 구역(등락률 큰 순) → 그 아래: 기존 뉴스 정리(핵심 → 중요 순,
// 일반 기사만 있는 회사는 접어둠). 급등락 종목은 위 구역에만 나오고 아래에는 중복해서 안 나옴.
function renderKeywordList(elId, items, emptyMsg){
  const el = document.getElementById(elId);
  if (!items.length && !kisMoverCount()){ el.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  const groups = groupKeywordItems(items);
  // KIS가 급등락이라고 한 종목 중 오늘 기사가 하나도 없는 것도 카드로 추가
  for (const [key, pct] of kisMoves){
    if (Math.abs(pct) >= KW_MOVE_MIN && !groups.some(g=>g.key===key)){
      groups.push({key, clusters: [], count: 0, latest: null, score: 0, move: Math.round(pct * 10) / 10, moveSrc: "kis"});
    }
  }
  const movers = groups.filter(g=>g.move != null).sort((a,b)=> Math.abs(b.move) - Math.abs(a.move));
  const others = groups.filter(g=>g.move == null);
  const primary = others.filter(g=>kwTier(g.score) !== "normal");
  const rest = others.filter(g=>kwTier(g.score) === "normal");
  const moversHtml = movers.length
    ? roundDividerHtml(`급등락 종목 (±${KW_MOVE_MIN}% 이상) · ${movers.length}개${kisAt ? ` · 시세 ${kstTimeLabel(kisAt)} 기준` : ""}`) + movers.map(g=>renderKeywordGroupCard(g, KW_MOVER_CLUSTERS)).join("")
    : "";
  const primaryHead = movers.length ? roundDividerHtml("뉴스 정리 (중요도순)") : "";
  const primaryHtml = primary.length
    ? primaryHead + primary.map(g=>renderKeywordGroupCard(g)).join("")
    : (movers.length && !rest.length ? "" : primaryHead + `<div class="empty">눈에 띄는 재료 없음</div>`);
  const restHtml = rest.length
    ? `<details class="sig-low-group"><summary>일반 기사 ${rest.length}개 회사 · ${rest.reduce((n,g)=>n+g.count,0)}건 보기</summary>
        <div class="sig-low-list">${rest.map(g=>renderKeywordGroupCard(g)).join("")}</div>
      </details>`
    : "";
  el.innerHTML = moversHtml + primaryHtml + restHtml;
}

function refreshDayKeys(){
  cachedTodayKey = kstDayKeyPadded(new Date().toISOString());
  cachedYestKey = kstDayKeyPadded(new Date(Date.now()-86400000).toISOString());
}

async function loadKeywordItems(){
  refreshDayKeys();
  const since = new Date(cachedTodayKey + "T00:00:00+09:00").toISOString(); // 오늘 0시(KST)부터만
  const rows = [];
  for (let from = 0; from < KW_MAX_ROWS; from += 1000){
    const {data, error} = await sb.from("items")
      .select("id,title,url,source,sentiment,keyword_match,published_at")
      .eq("source_type","newswire").not("keyword_match","is",null)
      .gte("published_at", since)
      .order("published_at",{ascending:false}).order("id",{ascending:false})
      .range(from, from+999);
    if (error || !data) break;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  cachedKeywordItems = rows;
  if (activeBriefTab === "keyword") renderActiveTab();
}

// KIS 시세 불러오기 — 오늘(KST) 갱신된 값만 씀(어제 값이 남아 있으면 무시)
async function loadPriceMoves(){
  refreshDayKeys();
  const since = new Date(cachedTodayKey + "T00:00:00+09:00").toISOString();
  const {data, error} = await sb.from("price_moves").select("keyword,pct,checked_at").gte("checked_at", since);
  if (error) return; // 테이블이 아직 없거나 오류면 기사 제목 기준으로만 동작
  kisMoves = new Map((data||[]).map(r => [r.keyword, Number(r.pct)]));
  kisAt = (data||[]).reduce((m, r) => (!m || r.checked_at > m) ? r.checked_at : m, null);
  if (activeBriefTab === "keyword") renderActiveTab();
}
let priceTimer = null;

// 수집 한 번에 새 기사가 수백 건씩 INSERT로 들어오므로, 화면 갱신은 모아서 한 번만
let kwRenderTimer = null;
function addKeywordItemLive(it){
  if (it.source_type !== "newswire" || !it.keyword_match) return;
  if (cachedKeywordItems.some(x=>x.id===it.id)) return;
  cachedKeywordItems.unshift(it);
  if (activeBriefTab !== "keyword") return;
  clearTimeout(kwRenderTimer);
  kwRenderTimer = setTimeout(renderActiveTab, 1000);
}

function renderActiveTab(){
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.tab === activeBriefTab);
  });
  const isKw = activeBriefTab === "keyword";
  // 브리핑 버튼은 텔레그램 탭 전용 — 추적 키워드 탭은 요약 없이 바로 정리해서 보여줌
  document.getElementById("brief-btn").style.display = isKw ? "none" : "";
  document.getElementById("brief-status").style.display = isKw ? "none" : "";
  if (isKw) document.getElementById("yesterday-details").style.display = "none"; // 키워드 탭엔 '어제' 구역 없음
  if (isKw){
    // 추적 키워드 탭은 오늘 것만 보여줌 — 어제 이전 기사는 수집 때 저장하지 않고 DB에서도 지움(poll.mjs)
    const today = cachedKeywordItems.filter(it=>kstDayKeyPadded(it.published_at)===cachedTodayKey);
    const companies = new Set(today.map(it=>it.keyword_match)).size;
    document.getElementById("today-title").textContent = `오늘 (${monthDayLabel(cachedTodayKey)})${today.length ? ` — ${companies}개 회사 · ${today.length}건` : ""}`;
    renderKeywordList("brief-today", today, "오늘 수집된 기사 없음");
    return;
  }
  document.getElementById("yesterday-details").style.display = "";
  const today = cachedTodayClusters.filter(c=>classifyClusterTab(c)===activeBriefTab);
  const yesterday = cachedYesterdayClusters.filter(c=>classifyClusterTab(c)===activeBriefTab);
  document.getElementById("today-title").textContent = `오늘 (${monthDayLabel(cachedTodayKey)})`;
  document.getElementById("yesterday-summary").textContent = `어제 (${monthDayLabel(cachedYestKey)})${yesterday.length ? ` — ${yesterday.length}건` : ""}`;
  document.getElementById("brief-today").innerHTML = roundListHtml(today, `아직 생성된 업데이트 없음 — "업데이트" 눌러서 만들어봐`, cachedTodayKey);
  document.getElementById("brief-yesterday").innerHTML = roundListHtml(yesterday, "기록 없음", cachedYestKey);
}

async function loadClusters(){
  cachedTodayKey = kstDayKeyPadded(new Date().toISOString());
  cachedYestKey = kstDayKeyPadded(new Date(Date.now()-86400000).toISOString());
  const {data} = await sb.from("clusters").select("*").in("day_key", [cachedTodayKey, cachedYestKey]).order("updated_at",{ascending:false});
  const rows = data || [];
  cachedTodayClusters = rows.filter(c=>c.day_key===cachedTodayKey);
  cachedYesterdayClusters = rows.filter(c=>c.day_key===cachedYestKey);
  renderActiveTab();
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    if (activeBriefTab === btn.dataset.tab) return;
    activeBriefTab = btn.dataset.tab;
    renderActiveTab();
  });
});
// 밀린 게 많아서 한 번 호출로 다 못 끝내면(has_more_backlog:true) 예전엔 사람이 "업데이트"를
// 여러 번 눌러야 했음(2026-09-28 변경) — 이제는 화면이 알아서 다 끝날 때까지 자동으로 이어서
// 호출함. 서버 쪽 연타 방지 쿨다운(30초)에 걸리면(429) 에러로 안 띄우고 잠깐 기다렸다 자동
// 재시도함 — 사람이 누른 게 아니라 자동으로 이어붙이는 거라 쿨다운은 그냥 기다리면 되는 거임.
// 혹시 모를 무한루프 방지로 최대 25번까지만 자동으로 이어서 처리함.
async function generateBriefing(){
  const btn = document.getElementById("brief-btn");
  const status = document.getElementById("brief-status");
  btn.disabled = true;
  const MAX_ROUNDS = 25;
  let totalItems = 0;
  let round = 0;
  const pressAt = new Date().toISOString(); // 이 버튼을 누른 순간 — 이어서 여러 번 호출돼도 같은 값을 보내서 한 번 누른 것으로 묶임
  try{
    while (true){
      round++;
      status.textContent = round === 1
        ? "새 기사 확인하고 요약하는 중 (밀린 게 많으면 몇 분 걸릴 수 있음)…"
        : `아직 밀린 게 남아서 자동으로 이어서 처리하는 중… (지금까지 ${totalItems}건 처리함, ${round}번째 호출)`;
      const res = await fetch("/api/summarize", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({run_at: pressAt})});
      const json = await res.json().catch(()=>({}));

      if (res.status === 429){
        // 연타 방지 쿨다운에 걸림 — 자동 이어처리 중이니 쿨다운 끝날 때까지 기다렸다 자동 재시도
        status.textContent = "잠깐 대기 중… (연타 방지 쿨다운, 자동으로 다시 시도함)";
        await new Promise(r=>setTimeout(r, 32000));
        round--; // 이번 시도는 실제 처리가 아니었으니 회차 수에서 빼줌
        continue;
      }
      if (!res.ok){
        status.textContent = `오류: ${json.error || "알 수 없는 오류"}`;
        return;
      }
      if (json.skipped){
        status.textContent = totalItems ? "" : json.message;
        break;
      }

      totalItems += json.item_count || 0;
      await loadClusters();

      if (!json.has_more_backlog){
        status.textContent = "";
        break;
      }
      if (round >= MAX_ROUNDS){
        status.textContent = `${totalItems}건 처리함 — 자동 반복 한도(${MAX_ROUNDS}회)에 도달함. 아직 밀린 게 더 있으면 "업데이트" 한번 더 눌러줘`;
        break;
      }
    }
  } catch(e){
    status.textContent = `오류: ${e.message}`;
  } finally {
    btn.disabled = false;
    loadLastBriefing(); // 상단 "텔레그램 요약" 시각 갱신(실시간 구독이 안 먹는 경우 대비)
  }
}
document.getElementById("brief-btn").onclick = generateBriefing;
// ──────────────────────────────────────────────────────────

document.getElementById("kw-add-btn").onclick = addKeyword;
document.getElementById("tg-add-btn").onclick = addChannel;
document.getElementById("kw-input").addEventListener("keydown", e=>{if(e.key==="Enter")addKeyword();});
document.getElementById("tg-input").addEventListener("keydown", e=>{if(e.key==="Enter")addChannel();});
document.getElementById("search-input").addEventListener("input", e=>{searchTerm = e.target.value.toLowerCase(); renderFeed();});

function renderCatPills(){
  const el = document.getElementById("cat-pills");
  el.innerHTML = "";
  CATS.forEach(([key,label,varName])=>{
    const pill = document.createElement("div");
    pill.className = "cat-pill" + (activeCat===key ? " active" : "");
    pill.innerHTML = key==="all" ? `<span>${label}</span>` : `<span class="dot" style="background:var(${varName})"></span><span>${label}</span>`;
    pill.onclick = ()=>{ activeCat = key; renderCatPills(); renderFeed(); };
    el.appendChild(pill);
  });
}

function renderFeed(){
  let list = allItems;
  if (activeCat!=="all") list = list.filter(it=>it.category===activeCat);
  if (searchTerm) list = list.filter(it=>(it.title+it.summary).toLowerCase().includes(searchTerm));
  const el = document.getElementById("feed");
  if (!list.length){ el.innerHTML = `<div class="empty">해당하는 항목이 없음</div>`; return; }

  let html = "";
  let lastLabel = null;
  for (const it of list){
    const label = dayLabel(it.published_at);
    if (label !== lastLabel){ html += `<div class="day-label">${label}</div>`; lastLabel = label; }
    const catInfo = CATS.find(c=>c[0]===it.category) || CATS[CATS.length-1];
    html += `
      <div class="item">
        <div class="item-top">
          <span class="dot" style="background:var(${catInfo[2]})"></span>
          <span class="badge ${it.sentiment}">${it.sentiment}</span>
          <span class="item-src">${it.source||""} · ${timeAgo(it.published_at)}</span>
        </div>
        <div class="item-title"><a href="${it.url}" target="_blank" rel="noopener">${it.title}</a></div>
        ${it.summary ? `<div class="item-sum">${it.summary}</div>` : ""}
      </div>`;
  }
  el.innerHTML = html;
}

async function loadItems(){
  const {data} = await sb.from("items").select("*").order("published_at",{ascending:false}).limit(300);
  allItems = data || [];
  renderFeed();
}
// 상단 시각 표시(2026-09-29): 텔레그램은 "요약 버튼을 마지막으로 누른 시각"(briefings 최신 기록),
// 추적 키워드는 "자동 수집이 마지막으로 돈 시각"(status id 2). 텔레그램 글 수집 시각(status id 1)은 툴팁에만 표시.
// 오늘이면 시각만, 아니면 "9/28 14:32"로 보여줌. 마우스를 올리면(툴팁) 각 결과 메모가 나옴.
const statusRows = {};
let lastBriefing = null;
function statusLabel(iso){
  if (!iso) return "정보 없음";
  const k = toKST(iso);
  const time = `${String(k.getUTCHours()).padStart(2,"0")}:${String(k.getUTCMinutes()).padStart(2,"0")}`;
  return kstDayKeyPadded(iso) === kstDayKeyPadded(new Date().toISOString()) ? time : `${k.getUTCMonth()+1}/${k.getUTCDate()} ${time}`;
}
function renderStatus(){
  const tg = statusRows[1], kw = statusRows[2];
  const el = document.getElementById("last-updated");
  el.textContent = `텔레그램 요약 ${statusLabel(lastBriefing?.created_at)} · 키워드 수집 ${statusLabel(kw?.last_run_at)}`;
  el.title = `텔레그램 요약: ${lastBriefing?.content || "-"}
텔레그램 글 수집(자동): ${statusLabel(tg?.last_run_at)} — ${tg?.last_note || "-"}
키워드 수집(자동): ${kw?.last_note || "-"}`;
}
async function loadLastBriefing(){
  const {data} = await sb.from("briefings").select("created_at,content").order("created_at",{ascending:false}).limit(1);
  lastBriefing = (data && data[0]) || null;
  renderStatus();
}
async function loadStatus(){
  const {data} = await sb.from("status").select("*");
  for (const r of data || []) statusRows[r.id] = r;
  await loadLastBriefing();
}

async function init(){
  renderCatPills();
  await Promise.all([loadKeywords(), loadChannels(), loadItems(), loadClusters(), loadKeywordItems(), loadPriceMoves()]);
  await loadStatus();

  // 실시간 구독 — DB에 새 행이 쓰이는 즉시 화면 반영 (수집 자체는 GitHub Actions가 5분 주기로 폴링)
  sb.channel("public:items")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"items"}, payload=>{
      allItems = [payload.new, ...allItems.filter(it=>it.id!==payload.new.id)];
      renderFeed();
      addKeywordItemLive(payload.new);
    })
    .subscribe();

  sb.channel("public:status")
    .on("postgres_changes", {event:"*", schema:"public", table:"status"}, payload=>{
      if (!payload.new || payload.new.id == null) return;
      statusRows[payload.new.id] = payload.new;
      renderStatus();
    })
    .subscribe();

  // KIS 시세는 종목 100여 개가 한꺼번에 갱신되므로 1초 모아서 한 번만 다시 불러옴
  sb.channel("public:price_moves")
    .on("postgres_changes", {event:"*", schema:"public", table:"price_moves"}, ()=>{
      clearTimeout(priceTimer);
      priceTimer = setTimeout(loadPriceMoves, 1000);
    })
    .subscribe();

  sb.channel("public:briefings")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"briefings"}, loadLastBriefing)
    .subscribe();

  sb.channel("public:clusters")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"clusters"}, loadClusters)
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"clusters"}, loadClusters)
    .subscribe();

  sb.channel("public:config")
    .on("postgres_changes", {event:"*", schema:"public", table:"keywords"}, loadKeywords)
    .on("postgres_changes", {event:"*", schema:"public", table:"telegram_channels"}, loadChannels)
    .subscribe();

  setInterval(renderFeed, 30000); // "n분 전" 텍스트 갱신용
}
init();
</script>

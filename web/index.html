<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>커버리지 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7; --text:#1A1A18; --sub:#6B6A63; --border:#E8E8E8;
    --stat:#F5F4ED; --block:#FFFFFF; --headerbg:#FFFFFFEE; --pillbg:#F0EFE8; --hover:#F0EFE8;
    --beat:#1D9E75; --miss:#D64545; --note:#D18F2E; --info:#2F7DD1;
    --cat-packaging:#8B5CF6; --cat-hbm:#12977F; --cat-cpo:#2F7DD1; --cat-power:#D18F2E;
    --cat-ai_server:#5C6BC0; --cat-korea:#C0392B; --cat-biotech:#C2478E;
    --cat-disclosure:#8A8578; --cat-telegram:#2AA8C7; --cat-other:#9C9891;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15140F; --text:#EDEAE0; --sub:#9C9891; --border:#33322A;
      --stat:#201F19; --block:#1B1A15; --headerbg:#15140FEE; --pillbg:#221F17; --hover:#26241C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15140F; --text:#EDEAE0; --sub:#9C9891; --border:#33322A;
    --stat:#201F19; --block:#1B1A15; --headerbg:#15140FEE; --pillbg:#221F17; --hover:#26241C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.5;}
  a{color:inherit;}
  .top{position:sticky;top:0;z-index:10;background:var(--headerbg);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;}
  .brand{font-weight:700;font-size:15px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--beat);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .meta{color:var(--sub);font-size:11px;margin-left:auto;}
  .wrap{max-width:920px;margin:0 auto;padding:14px 16px 60px;}
  .sec{font-size:13px;font-weight:600;margin:0;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:flex;align-items:center;gap:5px;background:var(--pillbg);border-radius:14px;padding:4px 10px;font-size:11px;}
  .chip button{border:none;background:none;color:var(--sub);cursor:pointer;font-size:12px;padding:0;line-height:1;}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .cat-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:14px;background:var(--pillbg);font-size:11px;cursor:pointer;border:1px solid transparent;}
  .cat-pill.active{border-color:var(--info);}
  .dot{width:7px;height:7px;border-radius:50%;}
  #search-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--block);color:var(--text);font-size:12px;font-family:inherit;margin-bottom:10px;}
  .day-label{font-size:11px;color:var(--sub);font-weight:600;margin:14px 0 6px;}
  .item{background:var(--block);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
  .item-top{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
  .badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:600;}
  .badge.beat{background:var(--beat);color:#fff;}
  .badge.miss{background:var(--miss);color:#fff;}
  .badge.note{background:var(--note);color:#fff;}
  .badge.neutral{background:var(--sub);color:#fff;}
  .item-title{font-size:13px;font-weight:500;}
  .item-title a{text-decoration:none;}
  .item-title a:hover{text-decoration:underline;}
  .item-src{font-size:10px;color:var(--sub);}
  .item-sum{font-size:11.5px;color:var(--sub);margin-top:4px;}
  .empty{color:var(--sub);font-size:12px;padding:8px 0;}

  /* 브리핑 히어로 섹션 */
  .hero{background:var(--block);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .hero-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .hero-head button{font-size:12px;padding:7px 14px;border:none;border-radius:6px;background:var(--info);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;}
  .hero-head button:disabled{opacity:.5;cursor:default;}
  .brief-status{color:var(--sub);font-size:11px;min-height:14px;margin-bottom:6px;}
  .day-group{margin-top:14px;}
  .day-title{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
  /* '어제' 섹션 기본 접힘용(2026-09-23 추가) — .sig-low-group과 동일한 화살표 패턴 재사용 */
  .day-group-collapse{margin-top:14px;}
  .day-group-collapse summary{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;list-style:none;margin-bottom:8px;}
  .day-group-collapse summary::-webkit-details-marker{display:none;}
  .day-group-collapse summary::before{content:"▸ ";}
  .day-group-collapse[open] summary::before{content:"▾ ";}
  /* 텔레그램/추적키워드 2탭(2026-09-23 추가, 2026-09-29 시황탭 제거) */
  .tab-nav{display:flex;gap:4px;margin-top:10px;border-bottom:1px solid var(--border);}
  .tab-btn{font-family:inherit;font-size:12px;font-weight:600;padding:7px 12px;border:none;background:transparent;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--info);border-bottom-color:var(--info);}
  .sig-row{background:var(--stat);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .sig-row:last-child{margin-bottom:0;}
  .sig-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;}
  .sig-badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;color:#fff;letter-spacing:.02em;}
  .sig-target{font-size:10px;background:var(--pillbg);border-radius:10px;padding:2px 8px;color:var(--text);}
  .sig-src{font-size:10px;color:var(--sub);margin-left:auto;white-space:nowrap;}
  .sig-title{font-size:12.5px;font-weight:500;}
  .sig-title a{text-decoration:none;}
  .sig-title a:hover{text-decoration:underline;}
  .sig-why{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.65;}
  .hot-box{background:var(--block);border:1px solid var(--border);border-left:3px solid var(--miss);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .hot-title{font-size:11px;font-weight:700;color:var(--miss);margin-bottom:2px;}
  .hot-row{padding:5px 0;border-top:1px solid var(--border);font-size:12.5px;line-height:1.5;}
  .hot-title+.hot-row{border-top:none;}
  .hot-time{color:var(--sub);font-size:10.5px;margin-right:6px;}
  .hot-key{font-weight:700;margin-right:5px;}
  .hot-why{color:var(--sub);font-size:11.5px;margin-top:1px;}
  .new-badge{display:inline-block;background:var(--info);color:#fff;font-size:9.5px;font-weight:700;border-radius:6px;padding:0 5px;margin-right:5px;vertical-align:1px;}
  .auto-warn{color:var(--miss);font-weight:600;}
  .sig-row-compact .sig-title{font-size:11.5px;font-weight:400;}
  /* 업데이트 누른 순간 구분선(2026-09-29 추가) */
  .round-divider{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:11px;font-weight:700;color:var(--info);}
  .round-divider::before,.round-divider::after{content:"";flex:1;height:1px;background:var(--info);opacity:.45;}
  .round-divider:first-child{margin-top:4px;}
  .sig-low-group{background:var(--block);border:1px solid var(--border);border-radius:8px;margin-top:2px;}
  .sig-low-group summary{padding:8px 12px;font-size:11px;color:var(--info);cursor:pointer;list-style:none;}
  .sig-low-group summary::-webkit-details-marker{display:none;}
  .sig-low-group summary::before{content:"▸ ";}
  .sig-low-group[open] summary::before{content:"▾ ";}
  .sig-low-list{padding:0 12px 8px;}
  .sig-low-list .sig-row{background:transparent;border-bottom:1px solid var(--border);border-radius:0;padding:7px 0;margin-bottom:0;}
  .sig-low-list .sig-row:last-child{border-bottom:none;}
  .sig-timeline{margin-top:6px;}
  .sig-timeline summary{font-size:10.5px;color:var(--info);cursor:pointer;list-style:none;}
  .sig-timeline summary::-webkit-details-marker{display:none;}
  .sig-timeline summary::before{content:"▸ ";}
  .sig-timeline[open] summary::before{content:"▾ ";}
  .sig-timeline-list{margin-top:5px;display:flex;flex-direction:column;gap:5px;}
  .sig-timeline-item{font-size:11px;color:var(--sub);line-height:1.5;}
  .sig-timeline-time{font-weight:700;color:var(--text);margin-right:4px;}
  .sig-sources{margin-top:6px;}
  .sig-sources summary{font-size:10.5px;color:var(--info);cursor:pointer;list-style:none;}
  .sig-sources summary::-webkit-details-marker{display:none;}
  .sig-sources summary::before{content:"▸ ";}
  .sig-sources[open] summary::before{content:"▾ ";}
  .sig-source-list{margin-top:5px;display:flex;flex-direction:column;gap:6px;}
  .sig-source-item{font-size:11px;}
  .sig-source-item a{text-decoration:none;}
  .sig-source-item a:hover{text-decoration:underline;}
  .sig-source-meta{color:var(--sub);font-size:10px;}
  /* 회사/섹터 기준 그룹 카드 (2026-09-22 추가): targets[0](대표 회사/섹터명) 기준으로 묶어서
     상위 카드 하나 + 그 아래 사건별 서브 항목으로 보여줌 */
  .sig-group{background:var(--stat);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .sig-group:last-child{margin-bottom:0;}
  .sig-group-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;}
  .sig-group-title{font-size:13px;font-weight:700;}
  .sig-group-count{font-size:10px;color:var(--sub);background:var(--pillbg);border-radius:10px;padding:1px 7px;}
  .sig-group-items{display:flex;flex-direction:column;gap:6px;}
  .sig-subitem{background:var(--block);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
  .sig-subitem-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;}
  .sig-badge-sm{font-size:8px;padding:1px 5px;}
  .sig-subitem-title{font-size:12px;font-weight:500;}
  .sig-verdict{font-size:11px;font-weight:800;letter-spacing:.02em;}

  /* 접이식 보조 섹션 */
  .collapse-box{background:var(--block);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;}
  .collapse-box>summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .collapse-box>summary::-webkit-details-marker{display:none;}
  .collapse-box>summary::before{content:"▸";color:var(--sub);}
  .collapse-box[open]>summary::before{content:"▾";}
  .collapse-box[open]>summary{border-bottom:1px solid var(--border);}
  .collapse-body{padding:12px;}
  .kw-row{display:flex;gap:6px;margin-bottom:8px;}
  .kw-row input{flex:1;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;}
  .kw-row button{font-size:12px;padding:6px 12px;border:none;border-radius:6px;background:var(--info);color:#fff;cursor:pointer;font-family:inherit;}

  /* ── 2026-11-28 화면 다시 짬: 넓은 화면에 카드를 격자로 여러 개씩, 카드마다 숫자 목록, 원문은 옆 패널 ── */
  .wrap{max-width:1760px;}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 2px;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .seg button{font-family:inherit;font-size:11.5px;padding:5px 10px;border:none;background:var(--block);color:var(--sub);cursor:pointer;}
  .seg button+button{border-left:1px solid var(--border);}
  .seg button.on{background:var(--info);color:#fff;font-weight:600;}
  .toolbar input,.toolbar select{font-family:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--block);color:var(--text);}
  .toolbar input{flex:1;min-width:160px;max-width:320px;}
  .toolbar select{max-width:200px;}
  .tool-count{font-size:11px;color:var(--sub);margin-left:auto;}
  /* (2026-11-28 사용자 지정) 한 줄에 카드 3개, 카드 줄 사이 위아래 간격 1cm. 좁은 화면에서는 2개 → 1개 */
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1cm 12px;align-items:start;}
  @media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:700px){.grid{grid-template-columns:minmax(0,1fr);}}
  .grid>.sig-group{margin-bottom:0;max-height:560px;overflow-y:auto;scrollbar-width:thin;}
  .grid>.empty{grid-column:1/-1;}
  .sig-group.low-only{background:transparent;border:1px solid var(--border);}
  .sig-group-title{overflow-wrap:anywhere;}
  /* 읽기 좋게(2026-11-28): 설명은 본문색·조금 큰 글씨·문장 단위 불릿, 불릿 사이는 띄움(--gap으로 조절), 핵심 숫자는 형광펜 */
  .hero{--gap:.65em;}
  .sig-why{font-size:12.5px;color:var(--text);line-height:1.6;margin-top:6px;overflow-wrap:anywhere;}
  .sig-why.old-note{border-top:1px solid var(--border);padding-top:7px;margin-top:9px;}
  .note{margin:0;padding-left:15px;}
  .note li{margin-bottom:var(--gap);}
  .note li:last-child{margin-bottom:0;}
  .note-label{font-weight:700;}
  .note-time{font-size:10.5px;font-weight:700;color:var(--sub);margin-bottom:4px;}
  .facts-label{font-size:10.5px;font-weight:700;color:var(--sub);margin-top:9px;}
  .impact-reason{font-size:10px;color:var(--sub);}
  .sig-subitem{padding:10px 12px;}
  .sig-subitem-title{font-size:13px;font-weight:600;line-height:1.45;}
  .sig-group-items{gap:8px;}
  .hot-why{font-size:12px;color:var(--text);line-height:1.55;}
  .sig-subitem-title{overflow-wrap:anywhere;}
  .facts{margin:5px 0 0;padding:0;list-style:none;}
  .facts li{font-size:12.5px;line-height:1.55;padding:0 0 0 9px;border-left:2px solid var(--border);margin-bottom:var(--gap);overflow-wrap:anywhere;}
  .facts li:last-child{margin-bottom:0;}
  .num{font-weight:600;color:var(--text);background:rgba(255,208,0,.38);border-radius:2px;padding:0 1px;font-variant-numeric:tabular-nums;}
  .excerpt{font-size:12.5px;color:var(--text);margin-top:6px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;}
  .link-btn{font-family:inherit;font-size:10.5px;color:var(--info);background:none;border:none;padding:0;cursor:pointer;margin-top:5px;text-align:left;}
  .link-btn:hover{text-decoration:underline;}
  .hot-rows{columns:2 420px;column-gap:18px;}
  .hot-row{break-inside:avoid;}
  .hot-row:first-child{border-top:none;}
  .hot-row .link-btn{font-size:12.5px;color:inherit;margin:0;}
  .post{background:var(--block);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;}
  .post-top{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--sub);margin-bottom:3px;}
  .post-ch{font-weight:700;color:var(--text);}
  .post-top a{margin-left:auto;color:var(--info);text-decoration:none;white-space:nowrap;}
  .post-text{font-size:12.5px;line-height:1.65;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:12;-webkit-box-orient:vertical;overflow:hidden;}
  .post.open .post-text{display:block;}
  .post .link-btn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drawer-back{position:fixed;inset:0;background:#0006;z-index:20;display:none;}
  .drawer-back.on{display:block;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--bg);border-left:1px solid var(--border);z-index:21;overflow-y:auto;padding:14px 16px 40px;transform:translateX(100%);transition:transform .15s;}
  .drawer.on{transform:none;}
  .drawer-close{float:right;font-family:inherit;font-size:12px;border:1px solid var(--border);background:var(--block);color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer;}
  .drawer h2{font-size:15px;margin:0 0 6px;line-height:1.4;overflow-wrap:anywhere;}
  .drawer h3{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 6px;}
  .drawer .post{cursor:default;margin-bottom:6px;}
  .drawer .post-text{display:block;}
  .cov-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .cov-table th{text-align:left;color:var(--sub);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .cov-table td{padding:4px 8px;border-bottom:1px solid var(--border);}
  .cov-table td.n{text-align:right;font-variant-numeric:tabular-nums;}
  .cov-table th.n{text-align:right;}
  .cov-note{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.6;}
  .cov-wrap{overflow-x:auto;}
</style>
</head>
<body>
  <div class="top">
    <span class="live-dot" id="live-dot"></span>
    <span class="brand">커버리지 레이더</span>
    <span class="meta" id="last-updated">연결 중…</span>
  </div>

  <div class="wrap">
    <div class="hero">
      <div class="hero-head">
        <div class="sec">브리핑</div>
        <button id="brief-btn" title="5분마다 자동으로 정리됨. 지금 바로 돌리고 싶을 때만 누르면 됨">지금 업데이트</button>
      </div>
      <div class="brief-status" id="brief-status"></div>

      <div class="tab-nav" id="brief-tabs">
        <button class="tab-btn active" data-tab="telegram">텔레그램</button>
        <button class="tab-btn" data-tab="keyword">추적 키워드</button>
      </div>

      <div class="toolbar" id="tg-toolbar">
        <span class="seg" id="view-seg">
          <button data-view="cards" title="AI가 회사·주제별로 묶어서 정리한 카드">정리 카드</button>
          <button data-view="raw" title="수집된 텔레그램 글을 하나도 빼지 않고 그대로">원문 전체</button>
        </span>
        <span class="seg" id="impact-seg">
          <button data-impact="all">전체</button>
          <button data-impact="medium">중간 이상</button>
          <button data-impact="high">높음만</button>
        </span>
        <select id="ch-select" title="채널 하나만 보기"></select>
        <input id="tg-search" placeholder="회사·단어 검색…" />
        <span class="tool-count" id="tool-count"></span>
      </div>

      <div class="day-group">
        <div class="day-title" id="today-title">오늘</div>
        <div id="brief-today"><div class="empty">불러오는 중…</div></div>
      </div>
      <details class="day-group-collapse" id="yesterday-details">
        <summary id="yesterday-summary">어제</summary>
        <div id="brief-yesterday"><div class="empty">기록 없음</div></div>
      </details>
    </div>

    <details class="collapse-box" id="cov-box">
      <summary id="cov-summary">텔레그램 수집 현황</summary>
      <div class="collapse-body" id="cov-body"><div class="empty">불러오는 중…</div></div>
    </details>

    <details class="collapse-box">
      <summary>추적 키워드 관리</summary>
      <div class="collapse-body">
        <div class="kw-row">
          <input id="kw-input" placeholder="종목명·회사명·테마 추가 (예: SK하이닉스)" />
          <button id="kw-add-btn">추가</button>
        </div>
        <div class="chips" id="kw-list"></div>
      </div>
    </details>

    <details class="collapse-box">

function timeAgo(iso){

  if (diff < 60) return "방금 전";
  if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;

// KST(UTC+9) 기준 날짜/시간 — 접속 브라우저 시간대와 무관하게 항상 한국시간 기준으로 계산
function toKST(iso){
  return new Date(new Date(iso).getTime() + 9*3600*1000); // UTC로 저장된 값을 KST wall-clock으로 이동

function kstDateKey(iso){

}

// ── 텔레그램 탭(2026-11-28 다시 짬) ─────────────────────────────────
// 바꾼 이유(사용자 요청): (1) 카드가 한 줄에 하나씩이라 한 화면에 몇 개 안 보였음 → 넓은 화면에 격자로 여러 개씩
// (2) 요약이 너무 줄어서 숫자가 다 빠졌음 → 카드마다 "숫자·사실 목록"(summarize.js의 facts)을 그대로 보여주고,
//     옛 카드처럼 목록이 없으면 지금까지 쌓인 설명을 전부 보여줌(예전엔 마지막 설명 하나만 보였음)
// (3) 텔레그램 글을 정말 다 보는지 알 수 없었음 → "원문 전체" 보기(수집된 글을 하나도 안 빼고) + "수집 현황" 표
// 보기 두 가지: 정리 카드(회사/주제별 카드) / 원문 전체(글 하나하나). 카드에서 "원문 보기"를 누르면 옆 패널에 원문이 뜸.
const IMPACT_LABEL = {high:"높음", medium:"중간", low:"낮음"};
const IMPACT_VAR = {high:"--miss", medium:"--note", low:"--sub"};
const IMPACT_ORDER = {high:0, medium:1, low:2};
const TG_PREFIX = "텔레그램: ";

// 옛 글은 &amp; &#036; 같은 표기가 그대로 저장돼 있음(2026-11-28부터는 수집할 때 풀어서 저장) — 화면에서 원래 글자로 되돌림
const ENT = {amp:"&", lt:"<", gt:">", quot:'"', apos:"'", nbsp:" "};
function decodeEnt(s){
  return String(s ?? "").replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (m, e)=>{
    if (e[0] === "#"){
      const code = e[1].toLowerCase() === "x" ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
      return Number.isFinite(code) && code > 0 && code <= 0x10ffff ? String.fromCodePoint(code) : m;
    }
    return ENT[e.toLowerCase()] ?? m;
  });
}
// 금액·비율처럼 "값"인 숫자만 굵게(연도·날짜는 그대로 둠). 글자는 전부 안전하게 바꿔서 넣음.
const NUM_RE = /[+\-−±]?[$₩€¥]\s?\d[\d,]*(?:\.\d+)?(?:\s?(?:bn|mn|tn|조|억|만))?|[+\-−±]?\d[\d,]*(?:\.\d+)?\s?(?:%p|%|bp|조|억|만|원|달러|위안|엔|유로|배|GW|MW|kWh|kW|nm|나노|톤|bn|mn)(?:\s?\d[\d,]*\s?(?:억|만|천))*(?:\s?(?:원|달러|위안|엔|유로))?/g;
function hl(raw){
  const s = decodeEnt(raw);
  let out = "", last = 0;
  for (const m of s.matchAll(NUM_RE)){
    out += esc(s.slice(last, m.index)) + `<b class="num">${esc(m[0])}</b>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

// 설명 맨 앞의 "[BEAT]"/"[MISS]"/"[혼조]"/"[IN-LINE]" 표시는 색깔 글자로(줄바꿈은 CSS white-space:pre-line이 처리)
const VERDICT_VAR = {BEAT:"--beat", MISS:"--miss", "혼조":"--note", "IN-LINE":"--sub"};
// ── 읽기 좋게 나누기(2026-11-28, 사용자: "띄어쓰기랑 가독성이 너무 안 좋다") ──
// 문장은 한 글자도 안 바꾸고 모양만 바꿈: 통문단을 문장 단위 불릿으로 끊고 불릿 사이를 띄움.
// 문장 끝은 "한글/닫는 괄호/% 뒤의 마침표 + 띄어쓰기"만 인정(소수점, "vs.", "U.S." 같은 건 안 끊음).
function splitSentences(line){
  return String(line).split(/(?<=[가-힣)\]"'”’%][.!?])\s+/).map(s=>s.trim()).filter(Boolean);
}
function noteLines(text){
  return String(text || "").split("\n").map(l=>l.replace(/^[-•·*▪◦]\s*/, "").trim()).filter(Boolean).flatMap(splitSentences);
}
// "섹터 톤: …", "TP: …"처럼 말머리가 있는 줄은 말머리를 굵게
function lineHtml(line){
  const m = decodeEnt(line).match(/^([^:：\s][^:：]{0,11})[:：]\s+(.+)$/s);
  return m ? `<span class="note-label">${esc(m[1])}</span> ${hl(m[2])}` : hl(line);
}
function noteHtml(text){
  let body = String(text || "");
  let verdict = "";
  const m = body.match(/^\[(BEAT|MISS|혼조|IN-LINE)\]\s*/);
  if (m){
    verdict = `<div class="sig-verdict" style="color:var(${VERDICT_VAR[m[1]]||"--sub"})">${m[1]}</div>`;
    body = body.slice(m[0].length);
  }
  const lines = noteLines(body);
  return verdict + (lines.length ? `<ul class="note">${lines.map(l=>`<li>${lineHtml(l)}</li>`).join("")}</ul>` : "");
}
// 옛 글은 줄바꿈이 지워진 채 저장돼 있음 — 줄바꿈이 하나도 없는 긴 글은 불릿 기호 앞과 문장 끝에서 줄을 나눠서 보여줌
// (2026-11-28부터 수집되는 글은 원래 줄바꿈이 살아 있어서 그대로 보여줌)
function postText(raw){
  const s = decodeEnt(raw);
  if (s.includes("\n") || s.length < 120) return s;
  return s.replace(/\s+(?=[•▶▷■□◆◇▪●✅✔☑📌🔹🔸➡※]|>>|\d{1,2}[.)]\s)/gu, "\n")
    .split("\n").flatMap(l=> l.length > 160 ? splitSentences(l) : [l]).join("\n");
}
function noteInline(text){
  let body = String(text || "");
  let verdict = "";
  const m = body.match(/^\[(BEAT|MISS|혼조|IN-LINE)\]\s*/);
  if (m){
    verdict = `<span class="sig-verdict" style="color:var(${VERDICT_VAR[m[1]]||"--sub"})">${m[1]}</span> `;
    body = body.slice(m[0].length);
  }
  return verdict + hl(body);
}

// 화면 상태(브라우저에 기억)
function pref(key, fallback){ try { return localStorage.getItem(key) || fallback; } catch { return fallback; } }
function setPref(key, v){ try { localStorage.setItem(key, v); } catch {} }
let tgView = pref("radar_view", "cards") === "raw" ? "raw" : "cards";
let impactFilter = ["all","medium","high"].includes(pref("radar_impact", "all")) ? pref("radar_impact", "all") : "all";
let channelFilter = "";  // 채널 하나만 보기("" = 전체)
let tgQuery = "";
const openPosts = new Set(); // "원문 전체"에서 펼쳐 둔 글(화면이 다시 그려져도 유지)

// 텔레그램 원문(어제 0시부터) — "원문 전체" 보기, 카드의 원문 미리보기, 수집 현황에 씀
let tgItems = [];
const tgByUrl = new Map();
let allClusters = [];
const clusterByUrl = new Map();
let channelHandles = [];

// 카드 하나(=사건 하나)를 화면에 그리기 좋게 정리: 숫자·사실 목록(최근 것부터, 겹치는 줄 뺌), 설명 이력, 원문 목록
function clusterView(c){
  const stamp = `${c.updated_at}|${(c.updates||[]).length}|${(c.sources||[]).length}`;
  if (c._v && c._v.stamp === stamp) return c._v;
  const ups = (Array.isArray(c.updates) ? c.updates : []).slice().sort((a,b)=> new Date(b.at) - new Date(a.at));
  const facts = [], seenF = new Set();
  const notes = [], seenN = new Set();
  for (const u of ups){
    for (const f of (Array.isArray(u.facts) ? u.facts : [])){
      const k = String(f).replace(/\s/g, "");
      if (k && !seenF.has(k)){ seenF.add(k); facts.push(String(f)); }
    }
    const n = String(u.note || "").replace(/\\n/g, "\n").trim(); // AI가 줄바꿈을 글자 그대로 "\n"으로 써 놓은 경우가 있음
    if (n && n !== "새로 감지됨" && !seenN.has(n)){ seenN.add(n); notes.push({at: u.at, note: n}); }
  }
  if (!notes.length && c.why) notes.push({at: c.updated_at, note: String(c.why)});
  const sources = [], seenU = new Set();
  for (const s of (Array.isArray(c.sources) ? c.sources : [])){
    if (!s || !s.url || seenU.has(s.url)) continue;
    seenU.add(s.url); sources.push(s);
  }
  sources.sort((a,b)=> new Date(b.published_at) - new Date(a.published_at));
  const hay = [c.headline, ...(c.targets||[]), ...notes.map(n=>n.note), ...facts].join(" ").toLowerCase();
  const reason = String((ups.find(u=>u.reason) || {}).reason || "");
  c._v = {stamp, facts, notes, sources, hay, reason};
  return c._v;
}

// 걸러 보기: 중요도 / 채널 / 검색어
function clusterPasses(c){
  if (impactFilter === "high" && c.impact !== "high") return false;
  if (impactFilter === "medium" && c.impact === "low") return false;
  const v = clusterView(c);
  if (channelFilter && !v.sources.some(s=>s.source === TG_PREFIX + channelFilter)) return false;
  if (tgQuery){
    if (v.hay.includes(tgQuery)) return true;
    return v.sources.some(s=> decodeEnt(tgByUrl.get(s.url)?.summary || s.title || "").toLowerCase().includes(tgQuery));
  }
  return true;
}
function postPasses(it){
  if (channelFilter && it.source !== TG_PREFIX + channelFilter) return false;
  const c = clusterByUrl.get(it.url);
  if (impactFilter === "high" && !(c && c.impact === "high")) return false;
  if (impactFilter === "medium" && c && c.impact === "low") return false;
  if (tgQuery && !decodeEnt(it.summary || it.title || "").toLowerCase().includes(tgQuery)) return false;
  return true;
}

function impactBadge(impact, small){
  return `<span class="sig-badge${small ? " sig-badge-sm" : ""}" style="background:var(${IMPACT_VAR[impact]||"--sub"})">${IMPACT_LABEL[impact]||"낮음"}</span>`;
}

// 회사/주제 카드 안의 사건 하나
function eventHtml(c, groupKey){
  const v = clusterView(c);
  const others = (c.targets||[]).filter(t=>t!==groupKey);
  const chips = others.slice(0, 4).map(t=>`<span class="sig-target">${esc(t)}</span>`).join("")
    + (others.length > 4 ? `<span class="sig-target" title="${esc(others.slice(4).join(", "))}">+${others.length - 4}</span>` : "");
  let body = "";
  if (v.notes.length){
    body += `<div class="sig-why">${noteHtml(v.notes[0].note)}</div>`;
    // 숫자 목록이 없는 옛 카드는 예전 설명들에 숫자가 들어 있으니 전부 보여줌(예전엔 마지막 설명 하나만 보였음)
    if (!v.facts.length){
      body += v.notes.slice(1).map(n=>`<div class="sig-why old-note"><div class="note-time">${kstTimeLabel(n.at)} 설명</div>${noteHtml(n.note)}</div>`).join("");
    }
  }
  if (v.facts.length) body += `<div class="facts-label">숫자·사실</div><ul class="facts">${v.facts.map(f=>`<li>${hl(f)}</li>`).join("")}</ul>`;
  if (!v.notes.length && !v.facts.length){
    // 설명이 아예 없는 카드(옛 "낮음" 카드)는 원문 앞부분을 그대로 보여줌
    const first = v.sources.map(s=>tgByUrl.get(s.url)).find(Boolean);
    if (first && first.summary) body += `<div class="excerpt">${hl(postText(String(first.summary).slice(0, 400)))}</div>`;
  }
  const more = v.facts.length && v.notes.length > 1 ? ` · 설명 이력 ${v.notes.length}건` : "";
  return `
    <div class="sig-subitem">
      <div class="sig-subitem-top">${impactBadge(c.impact, true)}${v.reason ? `<span class="impact-reason">${esc(v.reason)}</span>` : ""}${chips}<span class="sig-src">${kstTimeLabel(c.updated_at)}</span></div>
      <div class="sig-subitem-title">${newBadge(c.updated_at)}${esc(decodeEnt(c.headline))}</div>
      ${body}
      <button class="link-btn" data-open="${esc(c.id)}">원문 ${v.sources.length}건${more} 보기 ›</button>
    </div>`;
}

// 회사/주제 카드 — targets[0](대표 회사/주제명, summarize.js가 이 순서를 보장) 기준으로 묶음. 안의 사건은 중요도 → 최근순
function groupHtml(g){
  const best = g.items[0].impact;
  const latestIso = g.items.reduce((m,c)=> new Date(c.updated_at) > new Date(m) ? c.updated_at : m, g.items[0].updated_at);
  return `
    <div class="sig-group${best === "low" ? " low-only" : ""}">
      <div class="sig-group-top">
        ${impactBadge(best)}
        <span class="sig-group-title">${esc(g.key)}</span>
        ${g.items.length > 1 ? `<span class="sig-group-count">${g.items.length}건</span>` : ""}
        <span class="sig-src">최근 ${kstTimeLabel(latestIso)}</span>
      </div>
      <div class="sig-group-items">${g.items.map(c=>eventHtml(c, g.key)).join("")}</div>
    </div>`;
}
function groupClusters(clusters){
  const map = new Map();
  for (const c of clusters){
    const key = (c.targets && c.targets[0]) ? String(c.targets[0]) : "기타";
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(c);
  }
  const latest = items => items.reduce((mx,c)=> Math.max(mx, new Date(c.updated_at).getTime()), 0);
  const groups = [...map].map(([key, items])=>{
    items.sort((a,b)=> ((IMPACT_ORDER[a.impact]??3) - (IMPACT_ORDER[b.impact]??3)) || (new Date(b.updated_at) - new Date(a.updated_at)));
    return {key, items, latest: latest(items)};
  });
  // 순서: 중간 이상이 하나라도 있는 카드가 먼저(최근 갱신순), 낮음만 있는 카드는 그 뒤(최근 갱신순) — 접지 않고 다 보여줌
  groups.sort((a,b)=> ((a.items[0].impact === "low") - (b.items[0].impact === "low")) || (b.latest - a.latest));
  return groups;
}
function gridHtml(clusters, emptyMsg){
  if (!clusters.length) return `<div class="empty">${emptyMsg}</div>`;
  return `<div class="grid">${groupClusters(clusters).map(groupHtml).join("")}</div>`;
}

// ── 맨 위 "지금 중요한 것"(2026-11-26 추가) ─────────────────────────
// 오늘 중요도 "높음" 카드만 최근 갱신순으로 한 줄씩. 마지막으로 화면을 본 뒤에 새로 갱신된 건 "새" 표시.
// 마지막으로 본 시각은 이 브라우저에만 저장(localStorage) — 화면을 떠날 때(다른 탭/닫기) 갱신함.
const HOT_MAX = 12;
let lastSeenAt = 0;
try { lastSeenAt = Number(localStorage.getItem("radar_last_seen")) || 0; } catch {}
function markSeen(){ try { localStorage.setItem("radar_last_seen", String(Date.now())); } catch {} }
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "hidden") markSeen(); });
window.addEventListener("pagehide", markSeen);
function isNewSinceSeen(iso){ return lastSeenAt && new Date(iso).getTime() > lastSeenAt; }
function newBadge(iso){ return isNewSinceSeen(iso) ? `<span class="new-badge">새</span>` : ""; }

function hotListHtml(clusters){
  const hot = clusters.filter(c=>c.impact==="high")
    .sort((a,b)=> new Date(b.updated_at) - new Date(a.updated_at)).slice(0, HOT_MAX);
  if (!hot.length) return "";
  const nNew = hot.filter(c=>isNewSinceSeen(c.updated_at)).length;
  const rows = hot.map(c=>{
    const v = clusterView(c);
    const key = (c.targets && c.targets[0]) || "기타";
    // 설명 첫 줄만(리포트형은 "[BEAT]" 한 줄 뒤에 숫자가 오니까 그땐 다음 줄까지 붙임) — 전체는 눌러서 옆 패널에서
    const lines = String(v.notes[0]?.note || "").split("\n").map(l=>l.trim()).filter(Boolean);
    let firstLine = lines[0] || "";
    if (/^\[(BEAT|MISS|혼조|IN-LINE)\]$/.test(firstLine) && lines[1]) firstLine += " " + lines[1];
    const why = firstLine.length > 160 ? firstLine.slice(0, 160) + "…" : firstLine;
    const headline = decodeEnt(c.headline);
    const keyHtml = headline.startsWith(key) ? "" : `<span class="hot-key">${esc(key)}</span>`;
    return `<div class="hot-row">${newBadge(c.updated_at)}<span class="hot-time">${kstTimeLabel(c.updated_at)}</span>${keyHtml}`
      + `<button class="link-btn" data-open="${esc(c.id)}">${esc(headline)}</button>`
      + (why ? `<div class="hot-why">${noteInline(why)}</div>` : "")
      + `</div>`;
  }).join("");
  return `<div class="hot-box"><div class="hot-title">지금 중요한 것 · 높음 ${hot.length}건${nNew ? ` (새로 ${nNew}건)` : ""}</div><div class="hot-rows">${rows}</div></div>`;
}

// ── "원문 전체" 보기 — 수집된 텔레그램 글을 하나도 안 빼고 그대로(최근순). 누르면 펼쳐짐 ──
function postHtml(it, inDrawer){
  const c = clusterByUrl.get(it.url);
  const badge = c ? impactBadge(c.impact, true)
    : `<span class="sig-badge sig-badge-sm" style="background:var(--info)" title="아직 AI 정리 전 — 5분 안에 자동으로 정리됨">정리 대기</span>`;
  const ch = String(it.source || "").replace(TG_PREFIX, "");
  const into = c && !inDrawer ? `<button class="link-btn" data-open="${esc(c.id)}" title="이 글이 들어간 카드 열기">→ ${esc(decodeEnt(c.headline))}</button>` : "";
  return `
    <div class="post${openPosts.has(it.url) ? " open" : ""}" data-post="${esc(it.url)}">
      <div class="post-top">${inDrawer ? "" : badge}<span class="post-ch">${esc(ch)}</span><span>${inDrawer ? kstFullLabel(it.published_at) : kstTimeLabel(it.published_at)}</span>
        <a href="${safeUrl(it.url)}" target="_blank" rel="noopener">텔레그램에서 열기 ↗</a></div>
      <div class="post-text">${hl(postText(it.summary || it.title || ""))}</div>
      ${into}
    </div>`;
}
function rawHtml(posts, emptyMsg){
  if (!posts.length) return `<div class="empty">${emptyMsg}</div>`;
  return `<div class="grid">${posts.map(it=>postHtml(it, false)).join("")}</div>`;
}

// ── 옆 패널: 카드 하나의 설명 이력 전체 + 원문 전체 ──
let drawerId = null;
function closeDrawer(){
  drawerId = null;
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("drawer-back").classList.remove("on");
}
async function openDrawer(id){
  const c = allClusters.find(x=>String(x.id) === String(id));
  if (!c) return;
  drawerId = String(id);
  const v = clusterView(c);
  const el = document.getElementById("drawer");
  const targets = (c.targets||[]).map(t=>`<span class="sig-target">${esc(t)}</span>`).join(" ");
  const factsHtml = v.facts.length ? `<h3>숫자·사실 ${v.facts.length}줄</h3><ul class="facts">${v.facts.map(f=>`<li>${hl(f)}</li>`).join("")}</ul>` : "";
  const notesHtml = v.notes.length
    ? `<h3>설명 이력 ${v.notes.length}건 (최근 것부터)</h3>` + v.notes.map(n=>`<div class="sig-why old-note"><div class="note-time">${kstTimeLabel(n.at)} 설명</div>${noteHtml(n.note)}</div>`).join("")
    : "";
  const head = `<button class="drawer-close" id="drawer-close">닫기 ✕</button>
    <div class="sig-top" style="margin-bottom:6px">${impactBadge(c.impact)}${v.reason ? `<span class="impact-reason">${esc(v.reason)}</span>` : ""}<span class="sig-source-meta">마지막 업데이트 ${kstFullLabel(c.updated_at)}</span></div>
    <h2>${esc(decodeEnt(c.headline))}</h2>
    <div class="sig-top">${targets}</div>
    ${factsHtml}${notesHtml}
    <h3>원문 ${v.sources.length}건 (최근 것부터)</h3>`;
  const originals = () => v.sources.map(s=>{
    const it = tgByUrl.get(s.url);
    return postHtml(it || {url: s.url, source: s.source, published_at: s.published_at, summary: s.title}, true);
  }).join("");
  el.innerHTML = head + originals();
  el.scrollTop = 0;
  el.classList.add("on");
  document.getElementById("drawer-back").classList.add("on");
  // 화면에 아직 없는 원문(이틀보다 오래된 글)은 그때 불러옴
  const missing = v.sources.map(s=>s.url).filter(u=>!tgByUrl.has(u));
  for (let i = 0; i < missing.length; i += 40){
    const {data} = await sb.from("items").select("id,url,source,title,summary,published_at").in("url", missing.slice(i, i + 40));
    for (const it of data || []) tgByUrl.set(it.url, it);
  }
  if (missing.length && drawerId === String(id)) el.innerHTML = head + originals();
}

// ── 텔레그램 수집 현황 — "정말 다 보고 있나"를 눈으로 확인하는 표 ──
// 채널별로 어제 0시부터 수집된 글 수 / 그중 AI 정리가 끝난 수 / 마지막 글 시각. 못 읽는 채널은 맨 위에 빨갛게.
// 못 읽는 채널 목록은 수집기(scraper/collect.mjs)가 status 메모에 "못 읽는 채널: a, b"로 남긴 걸 읽음.
function unreadableChannels(){
  const m = String(statusRows[1]?.last_note || "").match(/못 읽는 채널: ([^·)]+)/);
  return m ? m[1].split(",").map(s=>s.trim()).filter(Boolean) : [];
}
function renderCoverage(){
  const body = document.getElementById("cov-body");
  if (!body) return;
  const unread = new Set(unreadableChannels());
  const per = new Map();
  for (const it of tgItems){
    const h = String(it.source || "").replace(TG_PREFIX, "");
    const p = per.get(h) || {n: 0, done: 0, last: null};
    p.n++;
    if (clusterByUrl.has(it.url)) p.done++;
    if (!p.last || it.published_at > p.last) p.last = it.published_at;
    per.set(h, p);
  }
  const handles = [...new Set([...channelHandles, ...per.keys()])];
  const rows = handles.map(h=>({h, ...(per.get(h) || {n: 0, done: 0, last: null}), bad: unread.has(h) || !/^[A-Za-z0-9_]{4,}$/.test(h)}));
  rows.sort((a,b)=> (b.bad - a.bad) || (b.n - a.n) || a.h.localeCompare(b.h));
  const total = rows.reduce((n,r)=>n + r.n, 0), done = rows.reduce((n,r)=>n + r.done, 0);
  const nBad = rows.filter(r=>r.bad).length, nQuiet = rows.filter(r=>!r.bad && !r.n).length;
  document.getElementById("cov-summary").innerHTML = `텔레그램 수집 현황 — 채널 ${rows.length}개 · 어제부터 글 ${total}건 · AI 정리 ${done}건`
    + (total - done ? ` · 정리 대기 ${total - done}건` : "")
    + (nBad ? ` <span class="auto-warn">· 못 읽는 채널 ${nBad}개</span>` : "");
  const state = r => r.bad
    ? `<span class="auto-warn">${unread.has(r.h) ? "못 읽음 — 채널이 웹 미리보기를 꺼 둠" : "채널 이름이 잘못됨 — 지우고 다시 추가"}</span>`
    : !r.n ? "어제부터 새 글 없음" : r.done < r.n ? `정리 대기 ${r.n - r.done}건` : "정상";
  body.innerHTML = `<div class="cov-wrap"><table class="cov-table">
      <tr><th>채널</th><th class="n">글</th><th class="n">AI 정리</th><th>마지막 글</th><th>상태</th></tr>
      ${rows.map(r=>`<tr><td><a href="https://t.me/s/${esc(r.h)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(r.h)}</a></td><td class="n">${r.n}</td><td class="n">${r.done}</td><td>${r.last ? statusLabel(r.last) : "-"}</td><td>${state(r)}</td></tr>`).join("")}
    </table></div>
    <div class="cov-note">글 수는 어제 0시(한국 시간)부터 수집된 것 기준.${nQuiet ? ` 새 글 없는 채널 ${nQuiet}개는 그냥 조용한 것.` : ""}<br>
    못 읽는 것: 사진·파일만 있고 글이 없는 게시물(그림 안의 숫자는 못 읽음), 웹 미리보기를 꺼 둔 채널. 글 하나는 앞 3,000자까지 저장.</div>`;
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function safeUrl(u){ return /^https?:\/\//i.test(u || "") ? esc(u) : "#"; }
function bigramSet(s){
  const clean = String(s || "").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
  const set = new Set();
  for (let i = 0; i < clean.length - 1; i++) set.add(clean.slice(i, i + 2));
  return set;
}
function diceSim(A, B){
  if (!A.size || !B.size) return 0;
  let inter = 0;
  for (const g of A) if (B.has(g)) inter++;
  return (2 * inter) / (A.size + B.size);
}

// 목표가/영업이익/매출 같은 % ("목표가 20%↑")는 주가 등락이 아니므로 제외. 여러 개면 제목에서 가장 뒤에 나온 것 사용
// (예: "5%대 급락했던 삼성전자, 배당락에도 0.9% 상승 마감" → 0.9% 상승).
const KW_PRICE_CTX = /주가|장중|장마감|특징주|급등|급락|상한가|하한가|수급포착|애프터마켓|프리마켓|거래일/;
const KW_UP_TEST = /^(급등|상승|↑|강세|올라|오른|\+)$/;
const KW_NOT_PRICE = /전날|전일|지난|목표|추정|전망|영업|매출|이익|수익|증가|성장|점유|비중|지분|금리|환율|수출|물량/;
const KW_MOVE_A = /(급등|상승|↑|강세|올라|오른|\+|급락|하락|↓|약세|내려|내린|떨어|-)\s*(\d{1,3}(?:\.\d+)?)\s*%/g;
const KW_MOVE_B = /(\d{1,3}(?:\.\d+)?)\s*%(?:대)?\s*(?:이상|넘게)?\s*(급등|상승|↑|강세|올라|오른|급락|하락|↓|약세|내려|내린|떨어)/g;
function kwPriceMove(t, keyword){
  if (!KW_PRICE_CTX.test(t)) return null;
  const upRe = KW_UP_TEST;
  const found = [];
  const push = (index, pct, word) => {
    if (KW_NOT_PRICE.test(t.slice(Math.max(0, index - 10), index))) return;
    found.push({index, pct: parseFloat(pct), up: upRe.test(word)});
  };
  for (const m of t.matchAll(KW_MOVE_A)) push(m.index, m[2], m[1]);
  for (const m of t.matchAll(KW_MOVE_B)) push(m.index, m[1], m[2]);
  if (!found.length) return null;
  found.sort((a, b) => a.index - b.index);
  // 제목에 여러 종목이 나오면("HPSP 7.68% 급등, 에코프로비엠 5.57% 하락") 이 회사 이름 바로 뒤에 나온 숫자를 우선,
  // 이름 위치를 모르거나 뒤에 없으면 제목에서 가장 뒤에 나온 것
  const at = keyword ? t.toLowerCase().indexOf(String(keyword).toLowerCase()) : -1;
  const after = at >= 0 ? found.filter(f => f.index >= at) : [];
  const last = after.length ? after[0] : found[found.length - 1];
  return Math.abs(last.pct) >= 5 ? (last.up ? 1 : -1) * Math.round(last.pct * 10) / 10 : null;
}
function kwScoreTitle(title, keyword){
  const t = String(title || "");
  let best = null, hits = 0;
  for (const [re, score, tag, pol] of KW_RULES){
    if (re.test(t)){
      hits++;
      if (!best || score > best.score || (score === best.score && best.pol === "neu" && pol !== "neu")) best = {score, tag, pol};
    }
  }
  // 주가 급등락(±5% 이상) — 기사 제목에 그렇게 적혀 있을 때
  const move = kwPriceMove(t, keyword);
  if (move !== null && (!best || best.score < 2)) best = {score: 2, tag: (move > 0 ? "급등 +" : "급락 ") + move + "%", pol: move > 0 ? "pos" : "neg"};
  let score = best ? best.score : 0;
  if (best && hits > 1) score += 0.5;                           // 여러 종류의 중요 단어가 겹치면 조금 더
  if (best && /\d+(?:\.\d+)?\s*조|\d{3,}(?:,\d{3})*\s*억/.test(t)) score += 1; // 100억원 이상 규모 숫자가 나오면 더
  if (KW_NOISE.test(t)) score = Math.min(score, 0);
  return {score, tag: best && score > 0 ? best.tag : "", pol: best ? best.pol : "neu", move: score > 0 ? move : null};
}

// 기사 중요도 점수 → 등급: 3.5 이상 핵심, 2 이상 중요, 나머지 일반(3.5 = 금액 100억 이상이거나 여러 신호가 겹친 재료)
const kwTier = score => score >= 3.5 ? "high" : score >= 2 ? "medium" : "normal";
const KW_TIER_LABEL = {high:"핵심", medium:"중요"};
const KW_POL_VAR = {pos:"--beat", neg:"--miss", neu:"--info"};

// 회사(keyword_match)별로 묶고 → 회사 안에서 제목 비슷한 기사끼리 묶고 → 중요도 순으로 정렬.
// 묶음의 대표 기사는 "점수 가장 높은 것"(같으면 최신). 여러 매체(3곳 이상)가 다룬 뉴스는 +1(큰 뉴스일 가능성).
// 회사 순서: 핵심 → 중요 → 일반 등급 순, 같은 등급이면 최근 기사가 있는 회사가 위.
// (KIS 시세 연동 시: 장중 급등 종목이면 여기 회사 점수에 가산하면 됨)
// KIS 시세(price_moves 테이블, scraper/prices.mjs가 장중 5분마다 갱신): {회사(키워드) → 오늘 등락률(%)}.
// 이 값이 있는 종목은 KIS 기준으로 ±5% 이상이면 "급등락 종목" 구역에 올라가고(오늘 기사가 없어도 카드가 뜸),
// 5% 미만이면 기사 제목이 뭐라고 했든 급등락에서 뺌. KIS에 없는 종목(해외/테마 등)은 기사 제목 기준으로 대신함.
const KW_MOVE_MIN = 5;
let kisMoves = new Map();
let kisAt = null; // 가장 최근 시세 갱신 시각
const kisMoverCount = () => [...kisMoves.values()].filter(p => Math.abs(p) >= KW_MOVE_MIN).length;

function groupKeywordItems(items){
  const byKw = new Map();
  for (const it of items){
    if (!it._kw) it._kw = kwScoreTitle(it.title, it.keyword_match);
    if (!byKw.has(it.keyword_match)) byKw.set(it.keyword_match, []);
    byKw.get(it.keyword_match).push(it);
  }
  const groups = [];
  for (const [key, list] of byKw){
    list.sort((a,b)=> new Date(b.published_at) - new Date(a.published_at));
    const clusters = []; // {rep, bg, members, score}
    for (const it of list){
      const bg = bigramSet(it.title);
      const hit = clusters.find(c => diceSim(bg, c.bg) >= KW_SIMILAR);
      if (hit) hit.members.push(it); else clusters.push({rep: it, bg, members: [it]});
    }
    for (const c of clusters){
      // 대표 = 점수 최고(같으면 최신 — members는 이미 최신순이라 처음 나온 것)
      c.rep = c.members.reduce((best, m)=> m._kw.score > best._kw.score ? m : best, c.members[0]);
      const nSrc = new Set(c.members.map(m=>m.source)).size;
      c.score = c.rep._kw.score > 0 ? c.rep._kw.score + (nSrc >= 3 ? 1 : 0) : 0;
    }
    clusters.sort((a,b)=> (b.score - a.score) || (new Date(b.members[0].published_at) - new Date(a.members[0].published_at)));
    // 급등락: KIS 시세가 있으면 그 값, 없으면 가장 최근에 "±5% 이상 움직였다"고 쓴 기사 제목 기준(list는 최신순)
    const mv = list.find(it => it._kw.move != null);
    const kis = kisMoves.get(key);
    groups.push({key, clusters, count: list.length, latest: list[0].published_at, score: clusters[0].score,
      move: kis !== undefined ? (Math.abs(kis) >= KW_MOVE_MIN ? Math.round(kis * 10) / 10 : null) : (mv ? mv._kw.move : null),
      moveSrc: kis !== undefined ? "kis" : "news"});
  }
  const rank = {high:0, medium:1, normal:2};
  groups.sort((a,b)=> (rank[kwTier(a.score)] - rank[kwTier(b.score)]) || (new Date(b.latest) - new Date(a.latest)));
  return groups;
}

function renderKeywordCluster(c){
  const rep = c.rep;
  let badge = "";
  if (c.score >= 2 && rep._kw.tag){
    badge = `<span class="sig-badge sig-badge-sm" style="background:var(${KW_POL_VAR[rep._kw.pol]||"--info"})">${esc(rep._kw.tag)}</span>`;
  } else {
    const sent = KW_SENT[rep.sentiment];
    if (sent) badge = `<span class="sig-badge sig-badge-sm" style="background:var(${sent[1]})">${sent[0]}</span>`;
  }
  const srcs = [...new Set(c.members.map(m=>m.source || "Google News"))];
  const srcText = srcs.length > 1 ? `${esc(srcs[0])} 외 ${srcs.length-1}곳` : esc(srcs[0]);
  const others = c.members.filter(m=>m!==rep);
  const moreHtml = others.length
    ? `<details class="sig-sources">
        <summary>비슷한 기사 ${others.length}건 보기</summary>
        <div class="sig-source-list">
          ${others.map(m=>`<div class="sig-source-item"><a href="${safeUrl(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a><br><span class="sig-source-meta">${esc(m.source||"")} · ${timeAgo(m.published_at)}</span></div>`).join("")}
        </div>
      </details>`
    : "";
  return `
    <div class="sig-subitem">
      <div class="sig-subitem-top">${badge}<span class="sig-source-meta">${srcText}</span><span class="sig-src">${kstTimeLabel(rep.published_at)}</span></div>
      <div class="sig-subitem-title"><a href="${safeUrl(rep.url)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(rep.title)}</a></div>
      ${moreHtml}
    </div>`;
}

function renderKeywordGroupCard(g, topN = KW_TOP_CLUSTERS){
  const tier = kwTier(g.score);
  const tierBadge = KW_TIER_LABEL[tier]
    ? `<span class="sig-badge" style="background:var(${IMPACT_VAR[tier]||"--sub"})">${KW_TIER_LABEL[tier]}</span>`
    : "";
  const moveChip = g.move != null
    ? `<span class="sig-badge" title="${g.moveSrc === "kis" ? "KIS 시세 기준" : "기사 제목 기준(실제 시세 아님)"}" style="background:var(${g.move > 0 ? "--beat" : "--miss"})">${g.move > 0 ? "▲ +" : "▼ "}${g.move}%</span>`
    : "";
  const shown = g.clusters.length
    ? g.clusters.slice(0, topN).map(renderKeywordCluster).join("")
    : `<div class="empty">오늘 관련 기사 없음</div>`;
  const rest = g.clusters.slice(topN);
  const restHtml = rest.length
    ? `<details class="sig-sources"><summary>나머지 ${rest.length}건 보기</summary><div class="sig-group-items" style="margin-top:6px">${rest.map(renderKeywordCluster).join("")}</div></details>`
    : "";
  return `
    <div class="sig-group">
      <div class="sig-group-top">
        ${tierBadge}
        <span class="sig-group-title">${esc(g.key)}</span>
        ${moveChip}
        <span class="sig-group-count">${g.count}건</span>
        ${g.latest ? `<span class="sig-src">최근 ${kstTimeLabel(g.latest)}</span>` : ""}
      </div>
      <div class="sig-group-items">${shown}${restHtml}</div>
    </div>`;
}

function roundDividerHtml(text){
  return `<div class="round-divider"><span>${text}</span></div>`;
}

// (2026-11-28) 회사 카드는 텔레그램 탭과 같은 격자(.grid)로 여러 개씩 나란히 보여줌
// 맨 위: 급등/급락(±5% 이상) 종목의 회사 카드 구역(등락률 큰 순) → 그 아래: 기존 뉴스 정리(핵심 → 중요 순,
// 일반 기사만 있는 회사는 접어둠). 급등락 종목은 위 구역에만 나오고 아래에는 중복해서 안 나옴.
function renderKeywordList(elId, items, emptyMsg){
  const el = document.getElementById(elId);
  if (!items.length && !kisMoverCount()){ el.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  const groups = groupKeywordItems(items);
  // KIS가 급등락이라고 한 종목 중 오늘 기사가 하나도 없는 것도 카드로 추가
  for (const [key, pct] of kisMoves){
    if (Math.abs(pct) >= KW_MOVE_MIN && !groups.some(g=>g.key===key)){
      groups.push({key, clusters: [], count: 0, latest: null, score: 0, move: Math.round(pct * 10) / 10, moveSrc: "kis"});
    }
  }
  const movers = groups.filter(g=>g.move != null).sort((a,b)=> Math.abs(b.move) - Math.abs(a.move));
  const others = groups.filter(g=>g.move == null);
  const primary = others.filter(g=>kwTier(g.score) !== "normal");
  const rest = others.filter(g=>kwTier(g.score) === "normal");
  const moversHtml = movers.length
    ? roundDividerHtml(`급등락 종목 (±${KW_MOVE_MIN}% 이상) · ${movers.length}개${kisAt ? ` · 시세 ${kstTimeLabel(kisAt)} 기준` : ""}`) + `<div class="grid">${movers.map(g=>renderKeywordGroupCard(g, KW_MOVER_CLUSTERS)).join("")}</div>`
    : "";
  const primaryHead = movers.length ? roundDividerHtml("뉴스 정리 (중요도순)") : "";
  const primaryHtml = primary.length
    ? primaryHead + `<div class="grid">${primary.map(g=>renderKeywordGroupCard(g)).join("")}</div>`
    : (movers.length && !rest.length ? "" : primaryHead + `<div class="empty">눈에 띄는 재료 없음</div>`);
  const restHtml = rest.length
    ? `<details class="sig-low-group"><summary>일반 기사 ${rest.length}개 회사 · ${rest.reduce((n,g)=>n+g.count,0)}건 보기</summary>
        <div class="sig-low-list"><div class="grid">${rest.map(g=>renderKeywordGroupCard(g)).join("")}</div></div>
      </details>`
    : "";
  el.innerHTML = moversHtml + primaryHtml + restHtml;
}

function refreshDayKeys(){
  cachedTodayKey = kstDayKeyPadded(new Date().toISOString());
  cachedYestKey = kstDayKeyPadded(new Date(Date.now()-86400000).toISOString());
}

async function loadKeywordItems(){
  refreshDayKeys();
  const since = new Date(cachedTodayKey + "T00:00:00+09:00").toISOString(); // 오늘 0시(KST)부터만
  const rows = [];
  for (let from = 0; from < KW_MAX_ROWS; from += 1000){
    const {data, error} = await sb.from("items")
      .select("id,title,url,source,sentiment,keyword_match,published_at")
      .eq("source_type","newswire").not("keyword_match","is",null)
      .gte("published_at", since)
      .order("published_at",{ascending:false}).order("id",{ascending:false})
      .range(from, from+999);
    if (error || !data) break;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  cachedKeywordItems = rows;
  if (activeBriefTab === "keyword") renderActiveTab();
}

// KIS 시세 불러오기 — 오늘(KST) 갱신된 값만 씀(어제 값이 남아 있으면 무시)
async function loadPriceMoves(){
  refreshDayKeys();
  const since = new Date(cachedTodayKey + "T00:00:00+09:00").toISOString();
  const {data, error} = await sb.from("price_moves").select("keyword,pct,checked_at").gte("checked_at", since);
  if (error) return; // 테이블이 아직 없거나 오류면 기사 제목 기준으로만 동작
  kisMoves = new Map((data||[]).map(r => [r.keyword, Number(r.pct)]));
  kisAt = (data||[]).reduce((m, r) => (!m || r.checked_at > m) ? r.checked_at : m, null);
  if (activeBriefTab === "keyword") renderActiveTab();
}
let priceTimer = null;

// 수집 한 번에 새 기사가 수백 건씩 INSERT로 들어오므로, 화면 갱신은 모아서 한 번만
let kwRenderTimer = null;
function addKeywordItemLive(it){
  if (it.source_type !== "newswire" || !it.keyword_match) return;
  if (cachedKeywordItems.some(x=>x.id===it.id)) return;
  cachedKeywordItems.unshift(it);
  if (activeBriefTab !== "keyword") return;
  clearTimeout(kwRenderTimer);
  kwRenderTimer = setTimeout(renderActiveTab, 1000);
}

function renderActiveTab(){
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.tab === activeBriefTab);
  });
  const isKw = activeBriefTab === "keyword";
  // 브리핑 버튼·걸러 보기 줄은 텔레그램 탭 전용 — 추적 키워드 탭은 요약 없이 바로 정리해서 보여줌
  document.getElementById("brief-btn").style.display = isKw ? "none" : "";
  document.getElementById("brief-status").style.display = isKw ? "none" : "";
  document.getElementById("tg-toolbar").style.display = isKw ? "none" : "";
  if (isKw) document.getElementById("yesterday-details").style.display = "none"; // 키워드 탭엔 '어제' 구역 없음
  if (isKw){
    // 추적 키워드 탭은 오늘 것만 보여줌 — 어제 이전 기사는 수집 때 저장하지 않고 DB에서도 지움(poll.mjs)
    const today = cachedKeywordItems.filter(it=>kstDayKeyPadded(it.published_at)===cachedTodayKey);
    const companies = new Set(today.map(it=>it.keyword_match)).size;
    document.getElementById("today-title").textContent = `오늘 (${monthDayLabel(cachedTodayKey)})${today.length ? ` — ${companies}개 회사 · ${today.length}건` : ""}`;
    renderKeywordList("brief-today", today, "오늘 수집된 기사 없음");
    return;
  }
  document.getElementById("yesterday-details").style.display = "";
  document.querySelectorAll("#view-seg button").forEach(b=>b.classList.toggle("on", b.dataset.view === tgView));
  document.querySelectorAll("#impact-seg button").forEach(b=>b.classList.toggle("on", b.dataset.impact === impactFilter));

  const todayPosts = tgItems.filter(it=>kstDayKeyPadded(it.published_at) === cachedTodayKey);
  const yestPosts = tgItems.filter(it=>kstDayKeyPadded(it.published_at) === cachedYestKey);
  const todayEl = document.getElementById("brief-today"), yestEl = document.getElementById("brief-yesterday");
  const filtered = impactFilter !== "all" || channelFilter || tgQuery;

  if (tgView === "raw"){
    const t = todayPosts.filter(postPasses), y = yestPosts.filter(postPasses);
    document.getElementById("today-title").textContent = `오늘 (${monthDayLabel(cachedTodayKey)}) — 글 ${t.length}건${filtered ? ` (전체 ${todayPosts.length}건 중)` : ""}`;
    document.getElementById("yesterday-summary").textContent = `어제 (${monthDayLabel(cachedYestKey)}) — 글 ${y.length}건`;
    todayEl.innerHTML = rawHtml(t, filtered ? "조건에 맞는 글 없음" : "오늘 수집된 글 없음");
    yestEl.innerHTML = rawHtml(y, "기록 없음");
  } else {
    const t = cachedTodayClusters.filter(clusterPasses), y = cachedYesterdayClusters.filter(clusterPasses);
    document.getElementById("today-title").textContent = `오늘 (${monthDayLabel(cachedTodayKey)}) — 사건 ${t.length}건${filtered ? ` (전체 ${cachedTodayClusters.length}건 중)` : ""}`;
    document.getElementById("yesterday-summary").textContent = `어제 (${monthDayLabel(cachedYestKey)}) — 사건 ${y.length}건`;
    todayEl.innerHTML = hotListHtml(t)
      + gridHtml(t, filtered ? "조건에 맞는 카드 없음" : "아직 정리된 게 없음 — 새 글이 들어오면 5분 안에 자동으로 정리됨");
    yestEl.innerHTML = gridHtml(y, "기록 없음");
  }
  const pending = todayPosts.filter(it=>!clusterByUrl.has(it.url)).length;
  document.getElementById("tool-count").textContent = `오늘 수집 글 ${todayPosts.length}건 · 사건 ${cachedTodayClusters.length}건` + (pending ? ` · 정리 대기 ${pending}건` : "");
}

async function loadClusters(){
  // 어제 0시 이후에 한 번이라도 갱신된 카드 전부(예전엔 만든 날짜가 오늘/어제인 것만 불러서, 그 전에 만들어졌다가
  // 어제·오늘 글이 합쳐진 카드는 "정리 대기"로 잘못 보일 수 있었음). 화면에는 만든 날짜가 오늘/어제인 것만 나옴.
  const since = yesterdayStartIso();
  const {data} = await sb.from("clusters").select("*").gte("updated_at", since).order("updated_at",{ascending:false}).limit(1000);
  allClusters = data || [];
  clusterByUrl.clear();
  for (const c of allClusters) for (const s of (c.sources || [])) if (s && s.url) clusterByUrl.set(s.url, c);
  cachedTodayClusters = allClusters.filter(c=>c.day_key===cachedTodayKey);
  cachedYesterdayClusters = allClusters.filter(c=>c.day_key===cachedYestKey);
  scheduleTgRender();
}

// 텔레그램 원문(어제 0시부터) 불러오기 — 1000개씩 끊어서 최대 5000개
async function loadTgItems(){
  const since = yesterdayStartIso();
  const rows = [];
  for (let from = 0; from < 5000; from += 1000){
    const {data, error} = await sb.from("items")
      .select("id,url,source,title,summary,published_at")
      .eq("source_type","telegram").gte("published_at", since)
      .order("published_at",{ascending:false}).order("id",{ascending:false})
      .range(from, from+999);
    if (error || !data) break;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  tgItems = rows;
  for (const it of rows) tgByUrl.set(it.url, it);
  renderChannelSelect();
  scheduleTgRender();
}
function addTgItemLive(it){
  if (it.source_type !== "telegram" || tgByUrl.has(it.url)) return;
  tgByUrl.set(it.url, it);
  tgItems.unshift(it);
  tgItems.sort((a,b)=> new Date(b.published_at) - new Date(a.published_at));
  scheduleTgRender();
}

function renderChannelSelect(){
  const sel = document.getElementById("ch-select");
  const counts = new Map();
  for (const it of tgItems){ const h = String(it.source || "").replace(TG_PREFIX, ""); counts.set(h, (counts.get(h) || 0) + 1); }
  const handles = [...new Set([...channelHandles, ...counts.keys()])].sort((a,b)=> (counts.get(b)||0) - (counts.get(a)||0) || a.localeCompare(b));
  sel.innerHTML = `<option value="">채널 전체 (${handles.length}개)</option>`
    + handles.map(h=>`<option value="${esc(h)}">${esc(h)} (${counts.get(h)||0})</option>`).join("");
  sel.value = handles.includes(channelFilter) ? channelFilter : "";
  if (!sel.value) channelFilter = "";
}

// 카드의 "원문 보기" → 옆 패널 / "원문 전체"의 글 → 누르면 펼침
document.addEventListener("click", e=>{
  const open = e.target.closest("[data-open]");
  if (open){ e.preventDefault(); openDrawer(open.dataset.open); return; }
  if (e.target.closest("#drawer-close") || e.target.id === "drawer-back"){ closeDrawer(); return; }
  if (e.target.closest("a")) return;
  const post = e.target.closest(".post[data-post]");
  if (post && !post.closest("#drawer") && !String(window.getSelection())){
    const url = post.dataset.post;
    if (openPosts.has(url)) openPosts.delete(url); else openPosts.add(url);
    post.classList.toggle("open");
  }
});

// 밀린 게 많아서 한 번 호출로 다 못 끝내면(has_more_backlog:true) 예전엔 사람이 "업데이트"를
// 여러 번 눌러야 했음(2026-09-28 변경) — 이제는 화면이 알아서 다 끝날 때까지 자동으로 이어서
// 호출함. 서버 쪽 연타 방지 쿨다운(30초)에 걸리면(429) 에러로 안 띄우고 잠깐 기다렸다 자동
// 재시도함 — 사람이 누른 게 아니라 자동으로 이어붙이는 거라 쿨다운은 그냥 기다리면 되는 거임.
// 혹시 모를 무한루프 방지로 최대 25번까지만 자동으로 이어서 처리함.
async function generateBriefing(){
  const btn = document.getElementById("brief-btn");
  const status = document.getElementById("brief-status");
  btn.disabled = true;
  const MAX_ROUNDS = 25;
  let totalItems = 0;
  let round = 0;
  const pressAt = new Date().toISOString(); // 이 버튼을 누른 순간 — 이어서 여러 번 호출돼도 같은 값을 보내서 한 번 누른 것으로 묶임
  try{
    while (true){
      round++;
      status.textContent = round === 1
        ? "새 글 확인하고 요약하는 중…"
        : `아직 밀린 게 남아서 자동으로 이어서 처리하는 중… (지금까지 ${totalItems}건 처리함, ${round}번째 호출)`;
      // 연결이 끊기거나("Failed to fetch") 서버가 시간 초과(504 등)로 죽으면(2026-10-23 추가) 예전엔 바로 오류로
      // 멈췄음 — 서버가 이미 처리한 글은 다시 처리하지 않게 돼 있어서, 몇 초 쉬고 자동으로 2번까지 다시 부름
      let res = null, json = {}, netErr = null;
      for (let attempt = 0; attempt < 3; attempt++){
        if (attempt > 0){
          status.textContent = `연결이 끊겨서 다시 시도하는 중… (${attempt}/2)`;
          await new Promise(r=>setTimeout(r, 5000));
        }
        try{
          res = await fetch("/api/summarize", {method:"POST", headers:{"content-type":"application/json"},
            body: JSON.stringify({run_at: pressAt, continuation: round > 1 || attempt > 0})});
          json = await res.json().catch(()=>({}));
          netErr = null;
          if (res.status < 502) break; // 502/503/504는 서버가 중간에 죽은 거라 다시 시도
        } catch(e){ netErr = e; }
      }
      if (netErr) throw new Error(`서버에 연결이 안 됨(${netErr.message}) — 인터넷 연결 확인하고 다시 눌러줘`);

      if (res.status === 409){
        status.textContent = "자동 요약이 지금 돌고 있음 — 끝나면 화면에 바로 뜸";
        break;
      }
      if (res.status === 429){
        // 연타 방지 쿨다운에 걸림 — 자동 이어처리 중이니 쿨다운 끝날 때까지 기다렸다 자동 재시도
        status.textContent = "잠깐 대기 중… (연타 방지 쿨다운, 자동으로 다시 시도함)";
        await new Promise(r=>setTimeout(r, 32000));
        round--; // 이번 시도는 실제 처리가 아니었으니 회차 수에서 빼줌
        continue;
      }
      if (!res.ok){
        status.textContent = `오류: ${json.error || `서버 응답 ${res.status}`}`;
        return;
      }
      if (json.skipped){
        status.textContent = totalItems ? "" : json.message;
        break;
      }

      totalItems += json.item_count || 0;
      loadClusters(); // 화면 갱신은 기다리지 않고 바로 다음 호출로 넘어감

      if (!json.has_more_backlog){
        status.textContent = "";
        break;
      }
      if (round >= MAX_ROUNDS){
        status.textContent = `${totalItems}건 처리함 — 자동 반복 한도(${MAX_ROUNDS}회)에 도달함. 아직 밀린 게 더 있으면 "업데이트" 한번 더 눌러줘`;
        break;
      }
    }
  } catch(e){
    status.textContent = `오류: ${e.message}`;
  } finally {
    btn.disabled = false;
    loadLastBriefing(); // 상단 "텔레그램 요약" 시각 갱신(실시간 구독이 안 먹는 경우 대비)
  }
}
document.getElementById("brief-btn").onclick = generateBriefing;

document.getElementById("kw-add-btn").onclick = addKeyword;
document.getElementById("tg-add-btn").onclick = addChannel;

document.getElementById("tg-input").addEventListener("keydown", e=>{if(e.key==="Enter")addChannel();});

// 상단 시각 표시(2026-09-29): 텔레그램은 "요약 버튼을 마지막으로 누른 시각"(briefings 최신 기록),
// 추적 키워드는 "자동 수집이 마지막으로 돈 시각"(status id 2). 텔레그램 글 수집 시각(status id 1)은 툴팁에만 표시.
// 오늘이면 시각만, 아니면 "9/28 14:32"로 보여줌. 마우스를 올리면(툴팁) 각 결과 메모가 나옴.
const statusRows = {};
let lastBriefing = null;
function statusLabel(iso){
  if (!iso) return "정보 없음";
  const k = toKST(iso);
  const time = `${String(k.getUTCHours()).padStart(2,"0")}:${String(k.getUTCMinutes()).padStart(2,"0")}`;
  return kstDayKeyPadded(iso) === kstDayKeyPadded(new Date().toISOString()) ? time : `${k.getUTCMonth()+1}/${k.getUTCDate()} ${time}`;
}
// 자동 처리(status id 3 = 마지막 자동 요약)가 20분 넘게 안 돌았으면 경고 — 예약(pg_cron)이 꺼졌거나 서버 오류
const AUTO_STALE_MS = 20 * 60 * 1000;
function renderStatus(){
  const tg = statusRows[1], kw = statusRows[2], auto = statusRows[3];
  const el = document.getElementById("last-updated");
  const autoAt = auto?.last_run_at;
  const stale = !autoAt || Date.now() - new Date(autoAt).getTime() > AUTO_STALE_MS;
  const autoErr = String(auto?.last_note || "").startsWith("오류");
  el.innerHTML = `자동 정리 ${statusLabel(autoAt)}`
    + (stale ? ` <span class="auto-warn">· 자동 처리 멈춤</span>` : autoErr ? ` <span class="auto-warn">· 오류</span>` : "")
    + ` · 텔레그램 수집 ${statusLabel(tg?.last_run_at)} · 키워드 수집 ${statusLabel(kw?.last_run_at)}`
    + (unreadableChannels().length ? ` <span class="auto-warn">· 못 읽는 채널 ${unreadableChannels().length}개</span>` : "");
  renderCoverage();
  el.title = `자동 정리: ${auto?.last_note || "-"}
텔레그램 요약 기록: ${lastBriefing?.content || "-"}
텔레그램 글 수집(자동): ${statusLabel(tg?.last_run_at)} — ${tg?.last_note || "-"}
키워드 수집(자동): ${kw?.last_note || "-"}`;
}
async function loadLastBriefing(){
  const {data} = await sb.from("briefings").select("created_at,content").order("created_at",{ascending:false}).limit(1);
  lastBriefing = (data && data[0]) || null;
  renderStatus();
}
async function loadStatus(){
  const {data} = await sb.from("status").select("*");
  for (const r of data || []) statusRows[r.id] = r;
  await loadLastBriefing();
}

async function init(){
  await Promise.all([loadKeywords(), loadChannels(), loadTgItems(), loadClusters(), loadKeywordItems(), loadPriceMoves()]);
  await loadStatus();

  // 실시간 구독 — DB에 새 행이 쓰이는 즉시 화면 반영 (수집은 아래 autoCollect가 5분마다 부르는 /api/poll)
  sb.channel("public:items")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"items"}, payload=>{
      addTgItemLive(payload.new);
      addKeywordItemLive(payload.new);
    })
    .subscribe();

  sb.channel("public:status")
    .on("postgres_changes", {event:"*", schema:"public", table:"status"}, payload=>{
      if (!payload.new || payload.new.id == null) return;
      statusRows[payload.new.id] = payload.new;
      renderStatus();
    })
    .subscribe();

  // KIS 시세는 종목 100여 개가 한꺼번에 갱신되므로 1초 모아서 한 번만 다시 불러옴
  sb.channel("public:price_moves")
    .on("postgres_changes", {event:"*", schema:"public", table:"price_moves"}, ()=>{
      clearTimeout(priceTimer);
      priceTimer = setTimeout(loadPriceMoves, 1000);
    })
    .subscribe();

  sb.channel("public:briefings")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"briefings"}, loadLastBriefing)
    .subscribe();

  sb.channel("public:clusters")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"clusters"}, loadClusters)
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"clusters"}, loadClusters)
    .subscribe();

  sb.channel("public:config")
    .on("postgres_changes", {event:"*", schema:"public", table:"keywords"}, loadKeywords)
    .on("postgres_changes", {event:"*", schema:"public", table:"telegram_channels"}, loadChannels)
    .subscribe();

  setInterval(renderStatus, 60000); // "자동 처리 멈춤" 경고가 시간이 지나면 뜨도록

  // 자동 처리(2026-11-26): 주 경로는 Supabase 예약(pg_cron)이 5분마다 /api/tick을 부르는 것. 화면을 열어 두면
  // 여기서도 5분마다 불러서, 예약이 아직 설정 안 됐거나 멈췄을 때도 돌게 함. 서버가 수집은 4분 안에 이미 돌았으면
  // 건너뛰고, 요약은 잠금으로 한 번만 돌게 하니까 탭 여러 개여도 괜찮음.
  // 새 글은 위 실시간 구독으로 화면에 바로 들어옴. 화면이 안 보일 땐(다른 탭) 안 부름.
  autoCollect();
  setInterval(autoCollect, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", autoCollect);
}
let lastAutoCollect = 0;
async function autoCollect(){
  if (document.visibilityState !== "visible") return;
  if (Date.now() - lastAutoCollect < 4 * 60 * 1000) return;
  lastAutoCollect = Date.now();
  try{
    const res = await fetch("/api/tick?by=screen", {method:"POST"});
    if (!res.ok) console.warn("자동 수집 실패:", res.status, await res.text().catch(()=>""));
  } catch(e){ console.warn("자동 수집 연결 실패:", e.message); }
}
init();
</script>
